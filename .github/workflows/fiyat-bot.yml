# Günlük fiyat güncellemesi — scripts/fiyat-bot.mjs
# ZAMANLAMA KAPALI: Epey GitHub sunucularını engelliyor (21.09.2026, 44/44 sayfa
# engel sayfası). Günlük çalışma yerel bilgisayarda: scripts/fiyat-bot-yerel.cmd
# (Windows Görev Zamanlayıcı). Bu iş akışı yalnızca elle denemek için duruyor.
# Gizli anahtar GEREKMEZ: bot fiyatları depodaki fiyatlar.json dosyasına yazar,
# bu iş akışı commit'ler, Vercel yayınlar. Site veritabanı ile dosyadan yeni olanı kullanır.
name: Fiyat botu

on:
  workflow_dispatch:
    inputs:
      yaz:
        description: 'Fiyatlar yazılsın mı? (hayır = yalnızca rapor)'
        type: boolean
        default: true

permissions:
  contents: write   # fiyatlar.json + fiyat-durum.json
  issues: write     # elle bakılması gerekenler için tek bir issue

concurrency: fiyat-bot

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fiyatları tara ve yaz
        env:
          RAPOR_DOSYASI: rapor.md
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.yaz }}" != "true" ]; then
            node scripts/fiyat-bot.mjs
          else
            node scripts/fiyat-bot.mjs --yaz
          fi

      - name: Fiyatları ve bekletme sayacını kaydet
        run: |
          git config user.name  "fiyat-botu"
          git config user.email "fiyat-botu@users.noreply.github.com"
          git add fiyatlar.json scripts/fiyat-durum.json
          if ! git diff --cached --quiet; then
            git commit -m "fiyat-botu: günlük fiyat güncellemesi"
            git push
          fi

      - name: Elle bakılacaklar için issue aç / güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASLIK="Fiyat botu: elle bakılması gerekenler"
          NO=$(gh issue list --state open --search "$BASLIK in:title" --json number -q '.[0].number')
          if [ -s rapor.md ]; then
            if [ -n "$NO" ]; then gh issue comment "$NO" --body-file rapor.md
            else gh issue create --title "$BASLIK" --body-file rapor.md; fi
          elif [ -n "$NO" ]; then
            gh issue close "$NO" --comment "Sorun kalmadı, kapatıldı."
          fi
