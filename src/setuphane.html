<style>
:root{
  --bg:#07070B; --bg2:#0E0E15; --ink:#ECEBF2; --dim:#8B88A0;
  --cy:#2DE2E6; --mg:#FF2D95; --line:rgba(236,235,242,.10);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:clip}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif; font-weight:300;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:var(--cy);color:#07070B}

#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90;transition:opacity .7s var(--ease)}
#boot.gone{opacity:0;pointer-events:none}

/* ── neon atmosferi ───────────────────────────────────────────────── */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:screen;will-change:transform}
.b1{width:46vw;height:46vw;min-width:320px;min-height:320px;background:rgba(45,226,230,.13);top:-10vh;left:-8vw;animation:d1 28s ease-in-out infinite}
.b2{width:40vw;height:40vw;min-width:290px;min-height:290px;background:rgba(255,45,149,.13);top:44vh;right:-12vw;animation:d2 34s ease-in-out infinite}
.b3{width:42vw;height:42vw;min-width:300px;min-height:300px;background:rgba(45,226,230,.075);bottom:-16vh;left:26vw;animation:d3 26s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vw,10vh,0) scale(1.18)}}
@keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.12)}50%{transform:translate3d(-9vw,-8vh,0) scale(.9)}}
@keyframes d3{0%,100%{transform:translate3d(0,0,0) scale(.95)}50%{transform:translate3d(6vw,-11vh,0) scale(1.2)}}
.grain{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.15;mix-blend-mode:overlay}

/* ── neon logo ────────────────────────────────────────────────────── */
.neonSvg{filter:drop-shadow(0 0 5px rgba(45,226,230,.55)) drop-shadow(0 0 18px rgba(255,45,149,.30))}
.neonWord{
  font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:.015em;
  color:transparent;-webkit-text-stroke-width:.055em;-webkit-text-stroke-color:var(--cy);
  text-shadow:0 0 .12em rgba(45,226,230,.75),0 0 .42em rgba(45,226,230,.40);
  white-space:nowrap;line-height:1;
}
.neonWord .hn{
  -webkit-text-stroke-color:var(--mg);
  text-shadow:0 0 .12em rgba(255,45,149,.8),0 0 .42em rgba(255,45,149,.45);
}
@supports not (-webkit-text-stroke-width:1px){
  .neonWord{color:var(--cy)} .neonWord .hn{color:var(--mg)}
}
.flicker{animation:flick 9s linear infinite}
@keyframes flick{
  0%,2.2%,2.9%,5.4%,100%{opacity:1}
  2.5%{opacity:.62} 5.7%{opacity:.78} 41%{opacity:1} 41.4%{opacity:.7} 41.8%{opacity:1}
}

/* ── cam kart + imleç parıltısı ───────────────────────────────────── */
.card{
  position:relative;overflow:hidden;border-radius:3px;
  background:rgba(255,255,255,.028);
  backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);
  border:1px solid rgba(45,226,230,.16);
}
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(460px circle at var(--mx,50%) var(--my,-20%), rgba(45,226,230,.12), transparent 62%);
  opacity:0;transition:opacity .6s var(--ease);
}
.card:hover::before,.card:focus-within::before{opacity:1}

/* ── görsel plakası ───────────────────────────────────────────────── */
.shot{position:relative;overflow:hidden;background:#0b0b12;border-radius:2px}
.shot .media{
  display:block;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.12) brightness(.58);transform:scale(1);
  transition:filter 1.5s var(--ease),transform 1.5s var(--ease);
}
.shot:hover .media,.shot:focus-within .media{filter:grayscale(.1) contrast(1.04) brightness(1);transform:scale(1.06)}
.shot .tint{position:absolute;inset:0;background:var(--cy);mix-blend-mode:color;opacity:.3;transition:opacity 1.5s var(--ease);pointer-events:none}
.shot:hover .tint,.shot:focus-within .tint{opacity:.05}
.shot .scan{position:absolute;inset:0;pointer-events:none;opacity:.3;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}
.shot .fade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,var(--bg) 0%,rgba(7,7,11,.35) 26%,transparent 58%)}
.brk{position:absolute;width:13px;height:13px;pointer-events:none;border-color:rgba(45,226,230,.55)}
.brk.tl{top:7px;left:7px;border-top:1px solid;border-left:1px solid}
.brk.tr{top:7px;right:7px;border-top:1px solid;border-right:1px solid}
.brk.bl{bottom:7px;left:7px;border-bottom:1px solid;border-left:1px solid}
.brk.br{bottom:7px;right:7px;border-bottom:1px solid;border-right:1px solid}
/* liste içindeki küçük parça görselleri: ikon boyutunda, ağır katmanlar olmadan */
.shot.sm .media{filter:grayscale(1) contrast(1.05) brightness(.95)}
.shot.sm:hover .media{filter:none;transform:scale(1.04)}
.shot.sm .tint{opacity:.14}
.shot.sm:hover .tint{opacity:0}
.shot.sm .scan{opacity:.16}
.shot.sm .brk{width:6px;height:6px}
.shot.sm .brk.tl{top:3px;left:3px}.shot.sm .brk.tr{top:3px;right:3px}
.shot.sm .brk.bl{bottom:3px;left:3px}.shot.sm .brk.br{bottom:3px;right:3px}

/* ── açılır panel: 0fr → 1fr ─────────────────────────────────────── */
.acc{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s var(--ease)}
.acc.open{grid-template-rows:1fr}
.acc>.accIn{overflow:hidden;min-height:0}

/* ── scroll ile belirme ──────────────────────────────────────────── */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ── tipografi ───────────────────────────────────────────────────── */
.h-xl{font-weight:300;line-height:.9;letter-spacing:-.035em}
.em{font-family:Newsreader,Georgia,serif;font-style:italic;font-weight:300;color:var(--mg);letter-spacing:-.01em}
.lbl{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}
.rule{height:1px;background:linear-gradient(to right,rgba(45,226,230,.45),rgba(236,235,242,.07) 40%,transparent)}

/* ── form kontrolleri ────────────────────────────────────────────── */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:34px;cursor:grab}
input[type=range]:active{cursor:grabbing}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(236,235,242,.16)}
input[type=range]::-moz-range-track{height:2px;background:rgba(236,235,242,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--cy);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--cy),0 0 22px rgba(45,226,230,.8);transition:transform .25s var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--cy);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--cy),0 0 22px rgba(45,226,230,.8)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
select{background:transparent;color:var(--ink);border:1px solid var(--line);font-family:"Space Grotesk",sans-serif;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--cy) 50%),linear-gradient(135deg,var(--cy) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:#0E0E15;color:#ECEBF2}

:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:2px}
.skip{position:fixed;top:-100px;left:16px;z-index:100;background:var(--cy);color:#07070B;padding:12px 20px;font-weight:500;transition:top .2s}
.skip:focus{top:16px}

/* ── mobil alt dock (masaüstündeki sağ panelin telefon karşılığı) ─── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(9,9,14,.92);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  border-top:1px solid rgba(45,226,230,.3);padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(0);transition:transform .5s var(--ease)}
.dock.hide{transform:translateY(115%)}
.tick{background:linear-gradient(to right,rgba(236,235,242,.22) 0 1px,transparent 1px 100%);background-size:5px 100%}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none}
  .shot .media{filter:grayscale(.25) contrast(1.05) brightness(.9)}
}
</style>
</head>

/* Denge cezası — oyun odaklı profillerde ZORUNLU.
   Ceza olmadan puanlamadaki tekil işlemci terimi, ekran kartının asla
   kullanamayacağı güçlü bir işlemciyi ödüllendiriyor ve optimizer kendi
   darboğazlı sistemini öneriyordu. Site darboğazı ölçüp gösterdiğine göre
   önerdiği sistemde de ondan kaçınmak zorunda. */
function balPenalty(g,c){
  if(g.id==='igpu') return 1;
  const r=(c.g*1.32)/g.idx;
  /* SADECE "işlemci fazla güçlü" yönünde ceza var.
     Ters yön (işlemci yetişemiyor) zaten puanın içindeki
     eff = min(gpu, cpu×1.32) ile cezalanıyor; ikinci kez vurunca çift sayım
     oluyordu ve 500 bin ₺ bütçede bile RTX 5090 yerine 5080 seçiliyordu. */
  return r>1.55 ? 1-Math.min(.25,(r-1.55)*.18) : 1;
}

 /* Math.min(92,...): oyunda 64 GB'ın 32 GB'a gerçek üstünlüğü yok. Tavan

/* ═══════════════════ hesap motoru ═══════════════════ */
function pickBoard(c,budget){
  const list=BOARDS[c.plat];
  const want = c.p>=20000 ? 3 : c.p>=13000 ? 2 : (budget>40000?2:1);
  const ok=list.filter(b=>b.t<=want);
  return ok.length ? ok[ok.length-1] : list[0];
}
const pickPsu   = (g,c)=> PSUS.find(p=>p.w>=(g.tdp+c.tdp+90)*1.35) || PSUS[PSUS.length-1];
const pickCooler= c => COOLERS.find(k=>k.cap>=c.tdp*1.15) || COOLERS[COOLERS.length-1];
const pickCase  = b => CASES.find(k=>b<=k.upTo) || CASES[CASES.length-1];

/* pick: {cpu:'AMD'|'Intel'|'', gpu:'NVIDIA'|'AMD'|''} — boş = fark etmez */
function buildSystem(budget,prof,pick){
  pick = pick || {cpu:'',gpu:''};
  let best=null;
  for(const g of GPUS){
    if(prof.needGpu && g.id==='igpu') continue;
    if(pick.gpu && g.id!=='igpu' && g.b!==pick.gpu) continue;
    for(const c of CPUS){
      if(pick.cpu && cpuBrand(c)!==pick.cpu) continue;
      if(g.id==='igpu' && !c.ig) continue;
      if(g.p+c.p>budget) continue;
      const mb=pickBoard(c,budget), psu=pickPsu(g,c), cl=pickCooler(c), cs=pickCase(budget);
      const base=g.p+c.p+mb.p+psu.p+cl.p+cs.p;
      for(const r of RAMS){
        if(r.gb<prof.minRam) continue;
        for(const s of SSDS){
          if(s.gb<prof.minSsd) continue;
          const total=base+r.p+s.p;
          if(total>budget) continue;
          const score=prof.score(g,c,r,s);
          if(!best || score>best.score+1e-9 || (Math.abs(score-best.score)<1e-9 && total<best.total))
            best={g,c,r,s,mb,psu,cl,cs,total,score};
        }
      }
    }
  }
  return best;
}
function fps(g,c,game,res){
  const vramPen=(g.vram && g.vram<game.vram)?.82:1;
  return Math.max(12,Math.round(Math.min(g.idx*res.mul*game.k*vramPen, c.g*game.ck)));
}

  return    {t:'Rekabetçi e-spor seviyesi',      c:'#2DE2E6'};
}
const MAX_CPU_G = Math.max.apply(null, CPUS.map(x=>x.g));

/* Darboğaz modeli.
   Önemli ayrım: "ekran kartı sınırlıyor" oyunda NORMALDİR — kayıp değil,
   kullanılmayan işlemci kapasitesidir ve ileride kart yükseltince işine yarar.
   Gerçek problem işlemcinin yetişememesidir. İkisini aynı dille anlatmak
   ("%13 kayıp, paran boşa gidiyor") sağlam bir bütçe sistemini kötü gösteriyordu. */
function balance(c,g){
  const ratio=(c.g*1.32)/g.idx;
  const pos=Math.max(4,Math.min(96, 50+(ratio-1.25)*55));

  if(ratio>=.98 && ratio<=1.55)
    return {k:'ok',sev:'none',loss:0,pos,unit:'',t:'Darboğaz yok',
      d:'İşlemci ve ekran kartı birbirini bekletmiyor. Verdiğin paranın tamamı ekrana yansıyor.'};

  if(ratio<.98){
    const loss=Math.round((1-ratio)*100);
    const enIyisi = c.g>=MAX_CPU_G;   /* daha güçlü işlemci yoksa bu bir hata değil */
    return {k:'cpu',sev: enIyisi ? 'minor' : (loss<12 ? 'minor' : 'real'),
      loss,pos,unit:'KAYIP',
      t: enIyisi ? 'Bundan güçlü işlemci yok' : loss<12 ? 'Neredeyse dengeli' : 'İşlemci yetişemiyor',
      d: enIyisi
        ? `Bu ekran kartını 1080p'de tam besleyecek işlemci üretilmiyor. 1440p ve 4K'da yük ekran kartına geçtiği için bu fark kapanır — yüksek çözünürlükte oynayacaksan sorun değil.`
        : loss<12
          ? `İşlemci ekran kartının biraz gerisinde ama fark %${loss} — oyunda bunu fark etmezsin.`
          : `Ekran kartı hazır bekliyor ama işlemci sipariş yetiştiremiyor. Yaklaşık %${loss} performans boşa gidiyor.`};
  }

  /* ratio > 1.55 — ekran kartı sınırlıyor. Bu KAYIP değil, yedek güç. */
  const bos=Math.round((ratio-1.55)/ratio*100);
  const asiri = ratio>2.2;
  return {k:'gpu',sev: asiri ? 'real' : 'minor', loss:bos, pos, unit:'İŞLEMCİDE YEDEK GÜÇ',
    t: asiri ? 'İşlemciye fazla harcanmış' : 'Ekran kartı sınırlıyor',
    d: asiri
      ? `İşlemci bu ekran kartına göre çok güçlü. Aradaki paranın ekran kartına gitmesi oyunda çok daha fazla kazandırırdı.`
      : `Oyunda sınırı ekran kartı koyuyor — bu normaldir. İşlemcinin %${bos} kadar yedek gücü var, yani ileride ekran kartını yükseltirsen işlemciyi değiştirmen gerekmez.`};
}
const bnColor = b => b.sev==='real' ? '#FF2D95' : b.sev==='minor' ? '#ECEBF2' : '#2DE2E6';

   Sayfada görünür olması şart: "gerçek fiyat" iddiası olan bir sitede verinin

   Not: GPU/CPU/RAM/SSD/PSU bu tarihte tek tek doğrulandı (Cimri/Akakçe).

   bunlar bütçenin küçük bir kısmı olduğu için öncelik GPU/CPU/RAM/SSD'ydi. */
const FIYAT_TARIHI='2026-08-13';
function fiyatYasi(){
  const g=Math.floor((Date.now()-new Date(FIYAT_TARIHI+'T12:00:00').getTime())/86400000);
  const m=new Date(FIYAT_TARIHI+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
  return {gun:Math.max(0,g), metin:m,
          bayat:g>30, uyari:g>30?'Bir aydan eski — alım öncesi kendin de kontrol et.':null};
}

const laptopFps = (l,game,res)=> Math.max(12, Math.round(l.idx*res.mul*game.k));

/* Cimri'nin ürün adı her şeyi tek satıra sıkıştırıyor:
   "Lenovo LOQ 15IRX10 83JE00EQTR i5-13450HX 12GB RAM 512GB SSD RTX 5060 FreeDOS 15.6 inç Oyun Bilgisayarı"
   Bunu ham basınca kart iki satıra taşıp ortadan kesiliyordu — üstelik
   işlemci/RAM/disk zaten alt satırda ayrıca yazıyor. Marka ve işlemciden
   sonrasını atıp model + seri kodunu ayırıyoruz. */
function laptopAd(l){
  let s=(l.name||'').replace(new RegExp('^\\s*'+(l.brand||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*','i'),'');
  const kes=s.match(/\s(i[3579][\s-]?\d{4,5}|Ryzen|Ultra\s|Core\s|Snapdragon)/i);
  if(kes) s=s.slice(0,kes.index);
  s=s.replace(/\s+/g,' ').trim();
  const par=s.split(' ');
  let seri=null;
  const son=par[par.length-1]||'';
  if(par.length>1 && son.length>=6 && /\d/.test(son) && /^[A-Z0-9._\-]+$/i.test(son) && son===son.toUpperCase()){
    seri=par.pop();
  }
  return {model:par.join(' ')||s||l.name, seri};
}

/* ═══════════════════ para birimi ═══════════════════ */
const NNBSP=' ';
const Cur=createContext(null);
const useCur=()=>useContext(Cur);

function group(n){
  const s=Math.round(Math.abs(n)).toString();
  let out='';
  for(let i=0;i<s.length;i++){ if(i>0 && (s.length-i)%3===0) out+=NNBSP; out+=s[i]; }
  return (n<0?'−':'')+out;
}
function CurProvider({children}){
  const [mode,setMode]=useState(()=>localStorage.getItem('sh_cur')||'TRY');
  const cached=(()=>{ try{return JSON.parse(localStorage.getItem('sh_rate')||'null')}catch(e){return null} })();
  const [rate,setRate]=useState(()=> (cached&&cached.r>1)?cached.r:47);
  const [live,setLive]=useState(()=> (cached&&cached.r>1)?'önbellek kuru':'varsayılan kur');

  useEffect(()=>{localStorage.setItem('sh_cur',mode)},[mode]);
  useEffect(()=>{
    let dead=false;
    (async()=>{
      const tries=[
        ['https://open.er-api.com/v6/latest/USD',      d=>d&&d.rates&&d.rates.TRY],
        ['https://api.frankfurter.app/latest?from=USD&to=TRY', d=>d&&d.rates&&d.rates.TRY],
      ];
      for(const [url,pick] of tries){
        try{
          const d=await (await fetch(url,{cache:'no-store'})).json();
          const r=pick(d);
          if(r&&r>1&&!dead){
            setRate(r); setLive('canlı kur');
            localStorage.setItem('sh_rate',JSON.stringify({r,ts:Date.now()}));
            return;
          }
        }catch(e){}
      }
    })();
    return()=>{dead=true};
  },[]);

  const fmt=useCallback(tl=> mode==='USD'
    ? '$'+NNBSP+group(tl/rate)
    : group(tl)+NNBSP+'₺', [mode,rate]);

  const human=useCallback(tl=>{
    const v = mode==='USD' ? tl/rate : tl;
    const u = mode==='USD' ? '$' : '₺';
    if(v>=1e6){ const m=v/1e6; return (m<10?m.toFixed(1).replace('.',','):Math.round(m))+NNBSP+'milyon'+NNBSP+u; }
    if(v>=1000 && Math.round(v)%1000===0) return group(v/1000)+NNBSP+'bin'+NNBSP+u;
    return group(v)+NNBSP+u;
  },[mode,rate]);

  const plain=useCallback(tl=> mode==='USD'
    ? '$ '+Math.round(tl/rate).toLocaleString('en-US')
    : Math.round(tl).toLocaleString('tr-TR')+' TL', [mode,rate]);

  return <Cur.Provider value={{mode,setMode,rate,live,fmt,human,plain}}>{children}</Cur.Provider>;
}

/* ═══════════════════ dil ═══════════════════
   Şimdilik yalnızca anahtar/buton altyapısı: TR/EN durumu seçilip
   localStorage'da saklanıyor, <html lang> güncelleniyor. Metinlerin
   kendisi henüz çevrilmedi — o iş kapsam olarak ayrı bırakıldı. */
const Lang=createContext(null);
const useLang=()=>useContext(Lang);
function LangProvider({children}){
  const [lang,setLang]=useState(()=>localStorage.getItem('sh_lang')||'tr');
  useEffect(()=>{
    localStorage.setItem('sh_lang',lang);
    document.documentElement.lang = lang==='en' ? 'en' : 'tr';
  },[lang]);
  return <Lang.Provider value={{lang,setLang}}>{children}</Lang.Provider>;
}

/* ═══════════════════ yardımcılar ═══════════════════ */
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function useCount(target,dur=850){
  const [v,setV]=useState(target);
  const from=useRef(target), raf=useRef(0);
  useEffect(()=>{
    if(reduced()){ setV(target); from.current=target; return; }
    const a=from.current, b=target, t0=performance.now();
    cancelAnimationFrame(raf.current);
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur);
      const e=1-Math.pow(1-p,3);                    /* easeOutCubic */
      setV(a+(b-a)*e);
      if(p<1) raf.current=requestAnimationFrame(step); else from.current=b;
    };
    raf.current=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf.current);
  },[target,dur]);
  return v;
}
function Reveal({children,delay=0,className='',as='div'}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    if(reduced()){ el.classList.add('in'); return; }
    const io=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){ setTimeout(()=>el.classList.add('in'),delay); io.disconnect(); }
    },{threshold:.1,rootMargin:'0px 0px -8% 0px'});
    io.observe(el); return()=>io.disconnect();
  },[delay]);
  return React.createElement(as,{ref,className:'rv '+className},children);
}
const glow=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty('--mx',(e.clientX-r.left)+'px');
  e.currentTarget.style.setProperty('--my',(e.clientY-r.top)+'px');
};
const Card = ({children,className='',...rest}) =>
  <div className={'card '+className} onMouseMove={glow} {...rest}>{children}</div>;
const Label = ({children,className=''}) =>
  <div className={'lbl text-dim '+className}>{children}</div>;

let sceneSeq=0;
function NeonScene({className='',w=1}){
  const CY='#2DE2E6', MG='#FF2D95';
  /* her kopyaya kendi gradyan kimliği: aynı id'yi paylaşan kopyalarda,
     ilk sahibi display:none olunca referans kopuyor ve kemer kayboluyordu */
  const gid=useRef(null);
  if(gid.current===null) gid.current='arcG'+(++sceneSeq);
  const arc='url(#'+gid.current+')';
  const s=(c,sw=w*3.4)=>({fill:'none',stroke:c,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'});
  /* Geometri: çember merkezi (150,108), r=96, kemer uçları y=140.8'de açık.
     Monitör ve kasanın HER köşesi merkeze 92.7'den yakın olmalı — aksi halde
     kemerden taşar. Önceki sürümde kasanın sağ üst köşesi 106.2 uzaklıktaydı
     ve neon tüpü delip geçiyordu. */
  return (
    <svg viewBox="0 0 300 196" className={'neonSvg '+className} fill="none" aria-hidden="true">
      <defs>
        <linearGradient id={gid.current} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor={MG}/><stop offset=".45" stopColor="#B14BE8"/><stop offset="1" stopColor={CY}/>
        </linearGradient>
      </defs>
      {/* kemer — altta açık, ~220° */}
      <path d="M59.8 140.8A96 96 0 1 1 240.2 140.8" {...s(arc,w*3.6)}/>
      {/* monitör */}
      <rect x="88" y="46" width="94" height="66" rx="5" {...s(CY)}/>
      <path d="M103 102 129 62M118 102 143 62M140 98 161 68" {...s(MG,w*2.1)} opacity=".85"/>
      <path d="M110 86 116 78" {...s(CY,w*1.9)} opacity=".8"/>
      {/* monitör ayağı */}
      <path d="M135 112v14M118 134l6-8h22l6 8z" {...s(CY)}/>
      {/* kasa */}
      <rect x="194" y="60" width="30" height="66" rx="4" {...s(MG)}/>
      <path d="M200 71h18M200 78h18M200 85h18" {...s(MG,w*1.9)} opacity=".85"/>
      <circle cx="209" cy="106" r="5" {...s(MG,w*2.2)}/>
      {/* masa — kemerin açık ağzından taşar, referansta da öyle */}
      <path d="M58 182 96 146h108l38 36z" {...s(arc,w*2.5)} opacity=".9"/>
      {/* klavye */}
      <path d="M86 176 112 154h66l24 22z" {...s(CY)}/>
      <path d="M97 169h94M105 162h78" {...s(CY,w*1.6)} opacity=".8"/>
      <path d="M124 176h40" {...s(CY,w*1.6)} opacity=".8"/>
      {/* mouse */}
      <rect x="210" y="164" width="12" height="14" rx="6" {...s(MG,w*2.2)}/>
      <path d="M216 164v4" {...s(MG,w*1.7)}/>
    </svg>

function rotaCoz(){
  const p=(location.pathname||'/').replace(/\/+$/,'')||'/';
  const m=p.match(/^\/testler(?:\/([\w-]+))?$/);
  if(m) return {route:'testler', sub:m[1]||null};
  if(p==='/forum') return {route:'forum', sub:null};
  if(p==='/aksesuarlar') return {route:'aksesuarlar', sub:null};
  if(p==='/oner') return {route:'oner', sub:null};
  if(p==='/hakkimizda') return {route:'hakkimizda', sub:null};
  if(p==='/isbirlikleri') return {route:'isbirlikleri', sub:null};
  if(p==='/gizlilik') return {route:'gizlilik', sub:null};
  return {route:'ana', sub:null};
}

/* ═══════════════════ ORTAK: seçili sistem ═══════════════════
   Masaüstü kurulum ile hazır laptop'u aynı şekle indirger; böylece FPS
   hesabı, panel ve dock iki mod için de tek koddan çalışır. */
function asActive(mode,sys,lap){
  if(mode==='laptop'){
    if(!lap) return null;
    return {kind:'laptop', gIdx:lap.idx, cIdx:null, total:lap.price,
            gName:lap.gpu.toUpperCase(), cName:lap.cpu||'—', vram:8, lap};
  }
  if(!sys) return null;
  return {kind:'masaüstü', gIdx:sys.g.idx, cIdx:sys.c.g, total:sys.total,
          gName:sys.g.n, cName:sys.c.n, vram:sys.g.vram, sys};
}
function activeFps(a,game,res){
  if(!a) return 0;
  const vramPen=(a.vram && a.vram<game.vram)?.82:1;
  const byCpu = a.cIdx ? a.cIdx*game.ck : Infinity;
  return Math.max(12,Math.round(Math.min(a.gIdx*res.mul*game.k*vramPen, byCpu)));
}

  const b=balance(c,g), col=bnColor(b);
  /* toUpperCase() YOK: JS "işlemci"yi "IŞLEMCI" yapıyor, doğrusu "İŞLEMCİ".
     .lbl zaten CSS'te uppercase uyguluyor ve lang="tr" sayesinde tarayıcı
     Türkçe kurallarını doğru işletiyor. */
  const head = b.sev==='none' ? 'Darboğaz yok'
             : `${b.t} · %${b.loss} ${b.unit}`;
  if(compact) return (
    <span className="inline-flex items-center gap-2">
      <span className="w-1.5 h-1.5 rotate-45 shrink-0" style={{background:col}}/>
      <span style={{color:col}}>
        {b.sev==='none' ? 'Darboğaz yok'
         : b.k==='gpu' ? `Ekran kartı sınırlıyor (%${b.loss} yedek)`
         : `%${b.loss} kayıp`}
      </span>
    </span>
  );
  return (
    <div className="flex items-start gap-4 p-4 border" style={{borderColor:col+'44',background:col+'0d'}}>
      <span className="w-2.5 h-2.5 rotate-45 shrink-0 mt-1.5" style={{background:col,boxShadow:`0 0 14px ${col}`}}/>
      <div className="min-w-0">
        <div className="lbl mb-2" style={{color:col}}>{head}</div>
        <p className="text-[.88rem] leading-relaxed text-ink/80">
          {b.sev==='none'
            ? 'İşlemci ve ekran kartı birbirini bekletmiyor — sistemi zaten buna göre seçtik.'
            : b.d}
        </p>
      </div>
    </div>
  );
}

function AmdIntelCompare({budget,prof,game,res}){
  const {fmt}=useCur();
  const a=useMemo(()=>buildSystem(budget,prof,{cpu:'AMD',gpu:''}),[budget,prof]);
  const i=useMemo(()=>buildSystem(budget,prof,{cpu:'Intel',gpu:''}),[budget,prof]);
  const fa=a?fps(a.g,a.c,game,res):0, fi=i?fps(i.g,i.c,game,res):0;
  const faA=useCount(fa), fiA=useCount(fi);
  if(!a && !i) return null;

  /* FPS eşitse fiyat belirler — aksi halde "fark etmez" deyip 5 bin lira
     farkı görmezden geliyorduk. */
  const fpsWin  = fa>fi ? 'AMD' : fi>fa ? 'Intel' : null;
  const cheaper = (a&&i) ? (a.total<i.total ? 'AMD' : i.total<a.total ? 'Intel' : null) : null;
  const win = fpsWin || cheaper;
  const diff = Math.abs(fa-fi);
  const pct = Math.round(100*diff/Math.max(1,Math.min(fa,fi)||1));
  const costDiff = (a&&i) ? Math.abs(a.total-i.total) : 0;

  const Col=({t,b,f,fA,best})=>{
    const col=BRAND[t];
    return (
    <div className="p-5 border transition-colors"
         style={{borderColor: best?col:'rgba(236,235,242,.10)', background: best?col+'10':'transparent'}}>
      <div className="flex items-center justify-between gap-3 mb-4">
        <span className="inline-flex items-center gap-2.5 text-[1.05rem]" style={{color:best?col:'#ECEBF2'}}>
          <span className="w-2.5 h-2.5 rotate-45 shrink-0"
                style={{background:col, boxShadow:best?`0 0 12px ${col}`:'none'}}/>
          {t}
        </span>
        {best && <span className="lbl" style={{color:col}}>ÖNDE</span>}
      </div>
      {b ? (
        <>
          <div className="num text-[2.1rem] font-light leading-none" style={{color:best?col:'#ECEBF2'}}>
            {Math.round(fA)}<span className="lbl text-dim ml-2">FPS</span>
          </div>
          <div className="mt-4 space-y-2 text-[.8rem]">
            <div className="flex justify-between gap-3"><span className="text-dim">İşlemci</span><span className="text-right text-ink/85">{b.c.n}</span></div>
            <div className="flex justify-between gap-3"><span className="text-dim">Ekran kartı</span><span className="text-right text-ink/85">{b.g.n}</span></div>
            <div className="flex justify-between gap-3"><span className="text-dim">Toplam</span><span className="num text-ink/85">{fmt(b.total)}</span></div>
          </div>
          <div className="mt-4 pt-4 border-t border-line text-[.8rem]">
            <BottleneckBadge c={b.c} g={b.g} compact/>
          </div>
        </>
      ) : (
        <p className="text-[.85rem] text-dim leading-relaxed">
          Bu bütçeye uyan {t} sistemi çıkmıyor. {t==='Intel' ? 'Intel tarafında en ucuz işlemci + anakart ikilisi daha pahalı başlıyor.' : ''}
        </p>
      )}
    </div>
    );
  };

  return (
    <Card className="mt-6 p-5 sm:p-7">
      <div className="flex items-baseline justify-between gap-4 mb-5 flex-wrap">
        <Label>AYNI PARAYA AMD Mİ, INTEL Mİ?</Label>
        <span className="lbl text-dim">{game.n.toUpperCase()} · {res.n}</span>
      </div>
      <div className="grid sm:grid-cols-2 gap-3">
        <Col t="AMD"   b={a} f={fa} fA={faA} best={win==='AMD'}/>
        <Col t="Intel" b={i} f={fi} fA={fiA} best={win==='Intel'}/>
      </div>
      {a && i && (
        <p className="mt-5 text-[.88rem] text-ink/80 leading-relaxed max-w-[58ch]">
          {fpsWin
            ? <>Bu bütçede <span style={{color:BRAND[fpsWin]}}>{fpsWin}</span> önde: aynı parayla{' '}
                <span className="num" style={{color:BRAND[fpsWin]}}>{diff} FPS</span> (%{pct}) daha fazla.</>
            : cheaper
              ? <>İkisi de <span className="num">{fa} FPS</span> veriyor — ama{' '}
                  <span style={{color:BRAND[cheaper]}}>{cheaper}</span> tarafı{' '}
                  <span className="num" style={{color:BRAND[cheaper]}}>{fmt(costDiff)}</span> daha ucuza aynı sonucu veriyor.
                  Aradaki fark cebinde kalır.</>
              : <>Bu bütçede ikisi de aynı FPS'i aynı paraya veriyor — hangisini alsan fark etmez.</>}
        </p>
      )}
    </Card>
  );
}

/* ═══════════════════ MODÜL 01 — SİSTEM KURUCU ═══════════════════ */
/* Tavan RTX 5090'lı sistemi kaldırmalı. Ama düz bir 18 bin–500 bin
   çubuğunda topluluğun asıl aralığı (25-80 bin) şeridin %13'üne sıkışıyor.
   Bu yüzden çubuk LOGARİTMİK: her adım oransal olarak eşit. */
/* Tavan: en pahalı sistem (5090 + 9950X3D + üst seviye her şey) RAM krizi
   ve RTX 5090 fiyat düzeltmesinden sonra ~330 bin'e çıktı (önceden ~232
   bindi). Kullanıcı isteğiyle tavan 1.000.000₺'ye çıkarıldı — birden fazla
   sistem/işlik bütçesi, çoklu GPU hayali vb. üst uçtaki meraklıları da
   kapsasın diye bilinçli olarak flagship sistemin çok üzerinde tutuldu. */
const BUD_MIN=18000, BUD_MAX=1000000, SLIDER_STEPS=1000;
const posToBudget = t => {
  const v = BUD_MIN*Math.pow(BUD_MAX/BUD_MIN, t/SLIDER_STEPS);
  return v<100000 ? Math.round(v/500)*500 : Math.round(v/2500)*2500;
};
const budgetToPos = b =>
  Math.round(SLIDER_STEPS*Math.log(b/BUD_MIN)/Math.log(BUD_MAX/BUD_MIN));

function BudgetSlider({id,label,budget,setBudget}){
  const {fmt,human}=useCur();
  const shown=useCount(budget,420);
  const pos=budgetToPos(budget);
  const pct=(pos/SLIDER_STEPS)*100;
  return (
    <>
      <div className="flex flex-wrap items-end justify-between gap-x-8 gap-y-3">
        <label htmlFor={id} className="lbl text-dim">{label}</label>
        <div className="num text-[clamp(2rem,7.4vw,3.4rem)] font-light leading-none text-cy">{fmt(shown)}</div>
      </div>
      <div className="mt-5">
        <input id={id} type="range" min={0} max={SLIDER_STEPS} step={1} value={pos}
          onChange={e=>setBudget(posToBudget(+e.target.value))} aria-valuetext={fmt(budget)}
          style={{background:`linear-gradient(to right,var(--cy) ${pct}%,transparent ${pct}%)`,
                  backgroundSize:'100% 2px',backgroundPosition:'0 50%',backgroundRepeat:'no-repeat'}}/>
        <div className="flex justify-between lbl text-dim/70 -mt-1">
          <span>{human(BUD_MIN)}</span>
          <span className="hidden sm:inline">{human(100000)}</span>
          <span>{human(BUD_MAX)}</span>
        </div>
      </div>
    </>
  );
}

/* ═══════════════════ MODÜL 02 — OYUN TESTİ ═══════════════════ */
function GameTest({act,gid,setGid,rid,setRid}){
  const {fmt}=useCur();
  const game=GAMES.find(g=>g.id===gid), res=RES.find(r=>r.id===rid);
  const f = activeFps(act,game,res);
  const v = fpsVerdict(f);
  const shown=useCount(f,900);
  const bar=useCount(fpsBar(f),900);
  const cpuLimited = act && act.cIdx ? act.cIdx*game.ck < act.gIdx*res.mul*game.k : false;

  return (
    <section id="oyun" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 02 — CANLI HESAP</Label>
        <div className="rule mb-10"/>
        <h2 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          Bu sistem <span className="em">kaç FPS</span> verir?
        </h2>
        <p className="mt-6 text-dim max-w-[54ch] leading-relaxed text-[.95rem]">
          <strong className="text-ink font-normal">FPS</strong>, ekrandaki görüntünün saniyede kaç kez yenilendiği.
          Sinema filmi 24 FPS'tir. Oyunda 60'ın altına inince el hareketin ekrana geç yansır — işte o "takılma" hissi.
        </p>
      </Reveal>

      <Reveal delay={110}>
        <Card className="mt-12 p-5 sm:p-9">
          <div className="grid sm:grid-cols-2 gap-5">
            <div>
              <label htmlFor="gsel" className="lbl text-dim block mb-3">HANGİ OYUN</label>
              <select id="gsel" value={gid} onChange={e=>setGid(e.target.value)} className="w-full px-4 py-3.5 text-[.95rem]">
                {GAMES.map(g=><option key={g.id} value={g.id}>{g.n} — {g.tag}</option>)}
              </select>
            </div>
            <div>
              <label htmlFor="rsel" className="lbl text-dim block mb-3">EKRAN ÇÖZÜNÜRLÜĞÜ</label>
              <select id="rsel" value={rid} onChange={e=>setRid(e.target.value)} className="w-full px-4 py-3.5 text-[.95rem]">
                {RES.map(r=><option key={r.id} value={r.id}>{r.full}</option>)}
              </select>
            </div>
          </div>
          <p className="text-[.82rem] text-dim mt-3 leading-relaxed">{res.cmp}</p>

          {act ? (
            <div className="mt-10">
              <div className="flex items-end gap-4 flex-wrap">
                <div className="num text-[clamp(3.4rem,17vw,7.5rem)] font-light leading-[.82]" style={{color:v.c}}>
                  {Math.round(shown)}
                </div>
                <div className="pb-3">
                  <div className="lbl text-dim mb-2">FPS · {act.kind.toUpperCase()}</div>
                  <div className="text-[1.05rem] leading-snug" style={{color:v.c}}>{v.t}</div>
                </div>
              </div>

              {/* gerçek ölçekli çubuk + referans işaretleri */}
              <div className="mt-9 mb-8">
                <div className="relative h-[3px] bg-ink/10">
                  <div className="absolute inset-y-0 left-0" style={{width:bar+'%',background:v.c,boxShadow:`0 0 22px ${v.c}`}}/>
                  {[30,60,144].map(m=>(
                    <span key={m} className="absolute top-0" style={{left:fpsBar(m)+'%'}}>
                      <span className="block w-px h-[11px] -mt-[4px] bg-ink/30"/>
                      <span className="lbl text-dim/70 block mt-2 -translate-x-1/2">{m}</span>
                    </span>
                  ))}
                </div>
              </div>

              <dl className="mt-10 grid sm:grid-cols-3 gap-x-8 gap-y-6 pt-8 border-t border-line">
                <div>
                  <dt className="lbl text-dim mb-2">TANIDIK BİR KIYAS</dt>
                  <dd className="text-[.92rem] leading-relaxed text-ink/85">
                    {f>=144 ? 'Sinema filminin altı katı akıcı. Göz ekranda hiç kesinti görmez.'
                     : f>=60 ? 'Sinema filminin iki-üç katı akıcı. Nişan alırken el hareketi anında ekrana yansır.'
                     : 'Sinema filmi seviyesinde. İzlemeye yeter, rekabetçi oyuna yavaş kalır.'}
                  </dd>
                </div>
                <div>
                  <dt className="lbl text-dim mb-2">SINIRI KOYAN PARÇA · DARBOĞAZ</dt>
                  <dd className="text-[.92rem] leading-relaxed text-ink/85">
                    {!act.cIdx ? <>Ekran kartı — <span className="text-cy">{act.gName}</span>{' '}
                                   <span className="text-dim">(laptopta değiştiremezsin)</span></>
                     : cpuLimited ? <>İşlemci — <span className="text-mg">{act.cName}</span></>
                                  : <>Ekran kartı — <span className="text-cy">{act.gName}</span></>}
                  </dd>

                  <dt className="lbl text-dim mb-2">HER 1 FPS'İN MALİYETİ</dt>
                  <dd className="num text-[.92rem] text-ink/85">{fmt(act.total/Math.max(1,f))}</dd>
                </div>

            </div>
          ) : <p className="mt-10 text-dim text-sm">Önce yukarıdan bir sistem seç.</p>}
        </Card>
      </Reveal>
    </section>
  );
}
/* ═══════════════════ MODÜL 03 — DENGE TESTİ ═══════════════════ */
function BalanceTest({sys}){
  const [cid,setCid]=useState(null), [gid,setGid]=useState(null);
  const sc = sys ? sys.c.id : null, sg = sys ? sys.g.id : null;
  useEffect(()=>{ if(sc) setCid(sc); },[sc]);
  useEffect(()=>{ if(sg) setGid(sg); },[sg]);

  const c = CPUS.find(x=>x.id===cid) || (sys?sys.c:CPUS[3]);
  const g = GPUS.find(x=>x.id===gid) || (sys?sys.g:GPUS[6]);
  const b = balance(c, g.id==='igpu'?GPUS[1]:g);
  const posA=useCount(b.pos,900);
  const lossA=useCount(b.loss,900);
  const col = bnColor(b);

  return (
    <section id="denge" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 03 — DARBOĞAZ TESTİ · CANLI HESAP</Label>
        <div className="rule mb-10"/>
        <h2 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          <span className="em">Darboğaz</span> var mı, ne kadar?
        </h2>
        <p className="mt-6 text-dim max-w-[56ch] leading-relaxed text-[.95rem]">
          <strong className="text-ink font-normal">Darboğaz</strong>, bir parçanın diğerini bekletmesi.
          Bir restoranı düşün: <strong className="text-ink font-normal">işlemci</strong> siparişleri alıp mutfağa dağıtan garson,
          <strong className="text-ink font-normal"> ekran kartı</strong> ise yemeği pişiren şef.
          Garson yavaşsa şef boş bekler, şef yavaşsa garson boş bekler. İkisi de para eder —
          ama biri boşta kalıyorsa o parayı çöpe atmışsın demektir. İşte o boşa giden kısım darboğazdır.
        </p>
      </Reveal>

      <Reveal delay={110}>
        <Card className="mt-12 p-5 sm:p-9">
          <div className="grid sm:grid-cols-2 gap-5">
            <div>
              <label htmlFor="csel" className="lbl text-dim block mb-3">İŞLEMCİ · GARSON</label>
              <select id="csel" value={c.id} onChange={e=>setCid(e.target.value)} className="w-full px-4 py-3.5 text-[.95rem]">
                {CPUS.map(x=><option key={x.id} value={x.id}>{x.n}</option>)}
              </select>
            </div>
            <div>
              <label htmlFor="gsel2" className="lbl text-dim block mb-3">EKRAN KARTI · ŞEF</label>
              <select id="gsel2" value={g.id==='igpu'?'b580':g.id} onChange={e=>setGid(e.target.value)} className="w-full px-4 py-3.5 text-[.95rem]">
                {GPUS.filter(x=>x.id!=='igpu').map(x=><option key={x.id} value={x.id}>{x.n}</option>)}
              </select>
            </div>
          </div>

          <div className="mt-11">
            <div className="flex justify-between lbl text-dim mb-3 gap-3">
              <span>İŞLEMCİ DARBOĞAZI</span><span className="hidden sm:inline text-cy">DARBOĞAZ YOK</span><span>EKRAN KARTI DARBOĞAZI</span>
            </div>
            <div className="relative h-11">
              <div className="absolute inset-x-0 top-1/2 h-[2px] -translate-y-1/2 tick"/>
              <div className="absolute top-1 bottom-1 left-1/2 w-px bg-cy/40"/>
              <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2"
                   style={{left:posA+'%'}}>
                <div className="w-[13px] h-[13px] rotate-45" style={{background:col,boxShadow:`0 0 26px ${col}`}}/>
              </div>
            </div>

            <div className="mt-8 grid lg:grid-cols-[1fr_auto] gap-8 items-start">
              <div>
                <div className="text-[1.5rem] sm:text-[1.9rem] font-light leading-tight" style={{color:col}}>{b.t}</div>
                <p className="mt-3 text-[.95rem] text-ink/80 leading-relaxed max-w-[46ch]">{b.d}</p>
                {b.sev==='real' && (
                  <p className="mt-4 text-[.88rem] text-dim leading-relaxed max-w-[46ch]">
                    <span className="text-cy">Öneri:</span>{' '}
                    {b.k==='cpu'
                      ? 'Aynı bütçede bir alt ekran kartına inip üstüne daha güçlü bir işlemci al. Oyunda daha fazla FPS alırsın.'
                      : 'İşlemciyi bir kademe düşürüp farkı ekran kartına ver. Oyundaki kazancı anında görürsün.'}
                  </p>
                )}
              </div>
              {b.loss>0 && (
                <div className="lg:text-right">
                  <div className="lbl text-dim mb-2 lg:max-w-[16ch] lg:ml-auto">{b.unit}</div>
                  <div className="num text-[3.4rem] font-light leading-none" style={{color:col}}>%{Math.round(lossA)}</div>
                </div>
              )}
            </div>
          </div>
        </Card>
      </Reveal>
    </section>
  );
}

/* ═══════════════════ ÖZET — sağ panel + mobil dock ═══════════════════ */
function summaryText(sys,prof,plain){
  return [
    'SETUP HANE — sistem listesi','Amaç: '+prof.n,'',
    'Ekran kartı : '+sys.g.n,
    'İşlemci     : '+sys.c.n,
    'Anakart     : '+sys.mb.n,
    'RAM         : '+sys.r.n,
    'SSD         : '+sys.s.n,
    'Güç kaynağı : '+sys.psu.n,
    'Soğutucu    : '+sys.cl.n,
    'Kasa        : '+sys.cs.n,'',
    'TOPLAM      : '+plain(sys.total),'',
    'instagram.com/setuphane'
  ].join('\n');
}
function useCopy(sys,prof,plain){
  const [copied,setCopied]=useState(false);
  const copy=useCallback(async()=>{
    if(!sys) return;
    const txt=summaryText(sys,prof,plain);
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){
      const ta=document.createElement('textarea');
      ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy')}catch(_){}
      document.body.removeChild(ta);
    }
    olay('liste_kopyalandi');
    setCopied(true); setTimeout(()=>setCopied(false),2200);
  },[sys,prof,plain]);
  return [copied,copy];
}

function Panel({sys,act,prof,game,res}){
  const {fmt,plain}=useCur();
  const isLap  = act && act.kind==='laptop';
  const total  = act?act.total:0;
  const f      = activeFps(act,game,res);
  const prebuilt = (sys && !isLap)?Math.round(sys.total*(1+PREBUILT_MARGIN)+ASSEMBLY):0;
  const save   = prebuilt-total;
  const savePct= prebuilt?Math.round(save/prebuilt*100):0;

  const totalA=useCount(total), fA=useCount(f), saveA=useCount(save), pctA=useCount(savePct);
  const [copied,copy]=useCopy(sys,prof,plain);

  return (
    <aside className="hidden lg:block" aria-label="Sistem özeti">
      <div className="lg:sticky lg:top-[100px] lg:mt-[34vh]">
        {!act ? (
          <Card className="p-7"><p className="text-sm text-dim leading-relaxed">Bütçeyi biraz yukarı çekince sistem burada belirecek.</p></Card>
        ) : (
        <Card className="p-7">
          <div className="flex items-center justify-between mb-6">
            <Label>{isLap?'SEÇTİĞİN LAPTOP':'SENİN SİSTEMİN'}</Label><span className="lbl text-cy">CANLI</span>
          </div>

          <div className="num text-[2.6rem] xl:text-[3rem] font-light leading-none text-ink">{fmt(totalA)}</div>
          <div className="lbl text-dim mt-3">{isLap?'EN UCUZ SATICI FİYATI':'TOPLAM PARÇA TUTARI'}</div>

          <div className="mt-7 pt-6 border-t border-line space-y-3.5">
            {(isLap
              ? [['Model',laptopAd(act.lap).model],['Ekran kartı',act.gName],['İşlemci',act.cName],['Bellek',(act.lap.ram||'—')+' GB']]
              : [['Ekran kartı',sys.g.n],['İşlemci',sys.c.n],['Bellek',sys.r.n],['Disk',sys.s.n]]
            ).map(([a,b])=>(
              <div key={a} className="flex justify-between gap-4 text-[.83rem]">
                <span className="text-dim shrink-0">{a}</span>
                <span className="text-right text-ink/85 leading-snug">{b}</span>
              </div>
            ))}
          </div>

          <div className="mt-7 pt-6 border-t border-line">
            <Label className="mb-3">{game.n.toUpperCase()} · {res.n}</Label>
            <div className="flex items-baseline gap-2">
              <span className="num text-[2rem] font-light" style={{color:fpsVerdict(f).c}}>{Math.round(fA)}</span>
              <span className="lbl text-dim">FPS</span>
            </div>
          </div>

          <div className="mt-7 pt-6 border-t border-line">
            <Label className="mb-3">DARBOĞAZ</Label>
            <div className="text-[.85rem]">
              {isLap
                ? <span className="text-dim leading-relaxed">Laptopta parça değiştirilemez — darboğazı sonradan düzeltemezsin.</span>
                : <BottleneckBadge c={sys.c} g={sys.g.id==='igpu'?GPUS[1]:sys.g} compact/>}
            </div>
          </div>

            <div className="mt-7 pt-6 border-t border-line">

                ve {fmt(ASSEMBLY)} montaj eklenerek hesaplandı.

/* ═══════════════════ MODÜL 05 — CİHAZ TESTİ ═══════════════════
   Gerçek ölçüm: tarayıcının ekran kartından ne kadar iş çıkarabildiğini
   kademeli yük artırarak bulur. 3DMark değildir (sürücü/tarayıcı etkiler)
   ama aynı testi herkes aynı şekilde çalıştırdığı için kıyaslanabilir. */

const BENCH_W=512, BENCH_H=512;

const VERT_SRC=`attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}`;
const FRAG_SRC=`precision highp float;
uniform float uTime; uniform int uSteps; uniform vec2 uRes;
void main(){
  vec2 uv=(gl_FragCoord.xy/uRes-0.5)*2.0;
  vec3 col=vec3(0.0); float a=0.0;
  for(int i=0;i<1024;i++){          /* GLSL ES 1.0: sınır sabit olmak zorunda */
    if(i>=uSteps) break;
    float f=float(i)*0.017+uTime;
    a+=sin(uv.x*3.0+f)*cos(uv.y*3.0-f);
    col+=vec3(sin(a*0.5),cos(a*0.3),sin(a*0.7))*0.0015;
  }
  gl_FragColor=vec4(abs(col),1.0);
}`;

/* Ziyaretçinin ekran kartını adından tanı.
   Benchmark puanını oyuna çevirmeye çalışmak yerine bunu yapıyoruz: tarayıcı
   zaten gerçek kart adını veriyor, bilinen kartın performansı da belli.
   Endeks ölçeği katalogla aynı (masaüstü RTX 5070 = 100). */
const GPU_TABLO=[
  [/rtx\s*50\s*90/i,205],[/rtx\s*50\s*80/i,152],[/rtx\s*50\s*70\s*ti/i,126],[/rtx\s*50\s*70/i,100],
  [/rtx\s*50\s*60\s*ti/i,74],[/rtx\s*50\s*60/i,58],[/rtx\s*50\s*50/i,44],
  [/rtx\s*40\s*90/i,185],[/rtx\s*40\s*80/i,145],[/rtx\s*40\s*70\s*ti/i,120],[/rtx\s*40\s*70/i,95],
  [/rtx\s*40\s*60\s*ti/i,72],[/rtx\s*40\s*60/i,55],[/rtx\s*40\s*50/i,40],
  [/rtx\s*30\s*90/i,125],[/rtx\s*30\s*80/i,118],[/rtx\s*30\s*70\s*ti/i,100],[/rtx\s*30\s*70/i,95],
  [/rtx\s*30\s*60\s*ti/i,82],[/rtx\s*30\s*60/i,62],[/rtx\s*30\s*50/i,40],
  [/rtx\s*20\s*80\s*ti/i,95],[/rtx\s*20\s*80/i,80],[/rtx\s*20\s*70/i,68],[/rtx\s*20\s*60/i,55],
  [/gtx\s*16\s*60/i,45],[/gtx\s*16\s*50/i,32],[/gtx\s*10\s*80/i,58],[/gtx\s*10\s*70/i,48],
  [/gtx\s*10\s*60/i,35],[/gtx\s*10\s*50/i,20],
  [/rx\s*90\s*70\s*xt/i,112],[/rx\s*90\s*70/i,92],[/rx\s*90\s*60\s*xt/i,64],
  [/rx\s*79\s*00\s*xtx/i,150],[/rx\s*79\s*00\s*xt/i,130],[/rx\s*78\s*00\s*xt/i,100],
  [/rx\s*77\s*00\s*xt/i,85],[/rx\s*76\s*00/i,55],
  [/rx\s*69\s*00/i,110],[/rx\s*68\s*00\s*xt/i,100],[/rx\s*68\s*00/i,90],[/rx\s*67\s*00\s*xt/i,78],
  [/rx\s*66\s*00/i,50],[/rx\s*65\s*00/i,32],[/rx\s*57\s*00\s*xt/i,62],[/rx\s*5\s*80/i,30],
  [/arc\s*b5\s*80/i,55],[/arc\s*b5\s*70/i,46],[/arc\s*a7\s*70/i,55],[/arc\s*a7\s*50/i,48],[/arc\s*a3\s*80/i,28],
  [/radeon\s*(8|7)\d0m/i,25],[/iris\s*xe/i,12],[/uhd\s*graphics/i,6],[/hd\s*graphics/i,4],
  [/apple\s*m4/i,55],[/apple\s*m3/i,45],[/apple\s*m2/i,38],[/apple\s*m1/i,30],
  [/adreno/i,10],[/mali/i,8],[/powervr/i,7],
];
function tanimlaGpu(ad){
  if(!ad) return null;
  for(const [re,idx] of GPU_TABLO){
    if(re.test(ad)){
      /* Dizüstü sürümleri aynı isimle gelir ama belirgin şekilde yavaştır */
      const mobil=/laptop|mobile|max-q/i.test(ad);
      return {idx: mobil?Math.round(idx*0.72):idx, mobil};
    }
  }
  return null;
}
/* "ANGLE (AMD, AMD Radeon RX 9070 XT (0x00007550) Direct3D11 ...)" → "AMD Radeon RX 9070 XT" */
function temizleGpuAdi(ad){
  if(!ad) return null;
  let s=ad.replace(/^ANGLE\s*\(/i,'').replace(/\)$/,'');
  s=s.replace(/\(0x[0-9a-f]+\)/ig,'');
  s=s.replace(/Direct3D\d+.*$/i,'').replace(/vs_\d_\d|ps_\d_\d|D3D\d+/ig,'');
  s=s.replace(/^(AMD|NVIDIA|Intel|Google Inc\.)\s*,\s*/i,'');
  return s.replace(/[\s,]+/g,' ').trim();
}

function detectDevice(){
  const c=document.createElement('canvas');
  const gl2=c.getContext('webgl2');
  const gl=gl2||c.getContext('webgl')||c.getContext('experimental-webgl');
  let gpu=null, vendor=null;
  if(gl){
    try{
      const ext=gl.getExtension('WEBGL_debug_renderer_info');
      if(ext){
        gpu=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
        vendor=gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);
      }
    }catch(e){}
  }
  return {
    gpu, vendor,
    api: gl2?'WebGL 2':(gl?'WebGL 1':null),
    cores: navigator.hardwareConcurrency||null,
    mem: navigator.deviceMemory||null,
    scrW: screen.width, scrH: screen.height,
    dpr: Math.round((window.devicePixelRatio||1)*100)/100,
    dokunmatik: window.matchMedia('(pointer:coarse)').matches
  };
}

/* Ekranın yenileme hızını rAF aralıklarından ölçer.
   Sekme geçişi/arka plan sırasında rAF kısıtlandığı için tek ölçüm "1 Hz" gibi
   saçma sonuç verebiliyordu — iki tur alıp büyüğünü kullanıyoruz. */
function tekHz(sure){
  return new Promise(res=>{
    let n=0; const t0=performance.now();
    const step=t=>{ n++; if(t-t0<sure) requestAnimationFrame(step); else res(n/((t-t0)/1000)); };
    requestAnimationFrame(step);
  });
}
async function measureHz(){
  let en=await tekHz(350);
  if(en<20){ await new Promise(r=>setTimeout(r,400)); en=Math.max(en, await tekHz(500)); }
  en=Math.max(en, await tekHz(350));
  return en<20 ? null : Math.round(en);
}

function makeGL(canvas){
  const gl=canvas.getContext('webgl',{antialias:false,powerPreference:'high-performance',preserveDrawingBuffer:false});
  if(!gl) return null;
  const sh=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT_SRC));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG_SRC));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(prog,'uRes');
  const ctx={gl, canvas, px:new Uint8Array(4),
             uTime:gl.getUniformLocation(prog,'uTime'), uSteps:gl.getUniformLocation(prog,'uSteps')};
  ctx.setRes=r=>{ canvas.width=r; canvas.height=r; gl.viewport(0,0,r,r); gl.uniform2f(uRes,r,r); };
  ctx.setRes(BENCH_W);
  return ctx;
}

/* Yük merdiveni: önce gölgelendirici adımı, tavana çarpınca çözünürlük.
   Sadece adım artırmak üst seviye kartlarda yetmiyordu — 1024 adımda bile
   kare süresi 22 ms'nin altında kalıp test tavana çarpıyordu. */
const YUK_MERDIVENI=[
  {r:512,s:64},{r:512,s:128},{r:512,s:256},{r:512,s:512},{r:512,s:1024},
  {r:1024,s:512},{r:1024,s:1024},{r:1536,s:1024},{r:2048,s:1024},
].map(l=>({...l, is:l.r*l.r*l.s}));

/* KRİTİK: requestAnimationFrame vsync'e kilitli olduğu için 171 Hz ekranda
   ölçüm 5.85 ms'nin altına inemiyordu — ekran hızını ölçüyorduk, kartı değil.
   Bunun yerine sıkı döngüde N kare çizip gl.finish() ile GPU'yu bekliyoruz;
   bu gerçek GPU süresini verir. setTimeout ile araya nefes bırakıyoruz ki
   sayfa donmasın. */
function runLevel(ctx,r,steps,frames){
  return new Promise(res=>{
    const {gl,uTime,uSteps,px}=ctx;
    ctx.setRes(r);
    gl.uniform1i(uSteps,steps);
    gl.uniform1f(uTime,0);
    gl.drawArrays(gl.TRIANGLES,0,3);
    gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);   /* ısınma + senkron */
    setTimeout(()=>{
      const t0=performance.now();
      for(let i=0;i<frames;i++){
        gl.uniform1f(uTime,i*0.013);
        gl.drawArrays(gl.TRIANGLES,0,3);
      }
      /* KRİTİK: gl.finish() tarayıcıda gerçekten beklemiyor — ölçüm 0 ms
         dönüyordu. readPixels GPU'dan veri istediği için boru hattını
         gerçekten bitmeye zorlar; güvenilir zamanlama bununla alınır. */
      gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      res(Math.max(0.02,(performance.now()-t0)/frames));
    },0);
  });
}

function DeviceTest({sys}){
  const {fmt}=useCur();
  const canvasRef=useRef(null);
  const [dev,setDev]=useState(null);
  const [hz,setHz]=useState(null);
  const [gid,setGid]=useState('cs2');
  const [rid,setRid]=useState('1080');
  const [phase,setPhase]=useState('idle');   /* idle | bench | stress | done */
  const [msg,setMsg]=useState('');
  const [res,setRes]=useState(null);
  const [log,setLog]=useState([]);
  const alive=useRef(true);

  useEffect(()=>{ setDev(detectDevice()); measureHz().then(setHz); return()=>{alive.current=false}; },[]);

  const scoreA=useCount(res?res.score:0);
  const adTemiz = dev ? temizleGpuAdi(dev.gpu) : null;
  const tanim   = dev ? tanimlaGpu(dev.gpu) : null;
  const oyun    = GAMES.find(g=>g.id===gid), coz = RES.find(r=>r.id===rid);
  /* İşlemci modeli tarayıcıdan okunamıyor; bu yüzden yalnızca ekran kartı
     tarafını hesaplıyoruz ve bunu açıkça yazıyoruz. */
  const senFps  = tanim ? Math.max(12,Math.round(tanim.idx*coz.mul*oyun.k)) : 0;
  const senFpsA = useCount(senFps);
  const senV    = fpsVerdict(senFps);

  async function bench(){
    setPhase('bench'); setRes(null); setLog([]); setMsg('Isınma turu…');
    const cv=canvasRef.current; cv.width=BENCH_W; cv.height=BENCH_H;
    let ctx;
    try{ ctx=makeGL(cv); }catch(e){ setMsg('WebGL başlatılamadı: '+e.message); setPhase('idle'); return; }
    if(!ctx){ setMsg('Bu tarayıcıda WebGL kapalı görünüyor.'); setPhase('idle'); return; }

    await runLevel(ctx,256,64,4);                    /* ısınma, sonuca katılmaz */

    let son=null, hist=[], kirildi=false;
    /* Merdiveni tırman, kare süresi 30 ms'yi geçince dur = kırılma noktası.
       Ölçülen son kademeyi saklıyoruz — önceki sürüm hiç çalıştırılmamış bir
       sonraki kademeyi rapor ediyordu. */
    for(let i=0;i<YUK_MERDIVENI.length;i++){
      const lv=YUK_MERDIVENI[i];
      setMsg(`Yük artırılıyor — ${lv.r}px · ${lv.s} kademe…`);
      const ms=await runLevel(ctx,lv.r,lv.s,6);
      if(!alive.current) return;
      son={...lv, ms};
      hist.push({etiket:`${lv.r}·${lv.s}`, ms:Math.round(ms*100)/100, fps:Math.round(1000/ms)});
      setLog([...hist]);
      if(ms>30){ kirildi=true; break; }
    }
    /* Puan: saniyede yapılan iş (piksel × gölgelendirici adımı) */
    const score=Math.round(son.is/Math.max(son.ms,0.1)/1e5);
    setRes({score, res:son.r, steps:son.s, ms:Math.round(son.ms*10)/10,
            fps:Math.round(1000/son.ms), hist, kirildi});
    setMsg(''); setPhase('done');
  }

  async function stress(sec=20){
    setPhase('stress'); setLog([]); setMsg('Zorlama testi çalışıyor…');
    const cv=canvasRef.current; cv.width=BENCH_W; cv.height=BENCH_H;
    let ctx;
    try{ ctx=makeGL(cv); }catch(e){ setMsg('WebGL hatası'); setPhase('idle'); return; }
    /* Hız testi çalıştıysa onun bulduğu kırılma yükünü kullan — böylece
       gerçekten zorlanıyor. Çalışmadıysa orta kademeyle başla. */
    const lv = res && res.res ? {r:res.res, s:res.steps} : {r:1536, s:1024};
    const samples=[];
    const t0=performance.now();
    while(performance.now()-t0 < sec*1000){
      const ms=await runLevel(ctx,lv.r,lv.s,4);
      if(!alive.current) return;
      samples.push({t:Math.round((performance.now()-t0)/100)/10, fps:Math.round(1000/ms)});
      setLog([...samples]);
      setMsg(`Zorlanıyor… ${Math.round(sec-(performance.now()-t0)/1000)} sn`);
    }
    /* İlk %30 atılıyor: kart hızını toplayana kadar ölçümler oynak oluyor.
       Karşılaştırma ORTALAMA değil MEDYAN üzerinden — tek tük sıçrama
       "termal kısılma" alarmı verdiriyordu (masaüstü kartta %25 düşüş gibi). */
    const tumF=samples.map(s=>s.fps);
    const f=tumF.slice(Math.max(1,Math.floor(tumF.length*0.30)));
    const med=a=>{ const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; };
    const yari=Math.max(1,Math.floor(f.length/2));
    const dus=Math.round((1-med(f.slice(yari))/Math.max(1,med(f.slice(0,yari))))*100);
    setRes(r=>({...(r||{}), stres:{
      min:Math.min.apply(null,f), max:Math.max.apply(null,f),
      ort:med(f), dus:Math.max(0,dus), kisiliyor: dus>=15, sure:sec, ornek:f.length
    }}));
    setMsg(''); setPhase('done');
  }

  const chart = log.length>1 ? (()=>{
    const vals=log.map(l=>l.fps);
    const mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
    const rng=Math.max(1,mx-mn);
    const pts=vals.map((v,i)=>`${(i/(vals.length-1))*100},${100-((v-mn)/rng)*88-6}`).join(' ');
    return {pts,mx,mn};
  })() : null;

  return (
    <section id="cihaz" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 05 — GERÇEK ÖLÇÜM</Label>
        <div className="rule mb-10"/>
        {/* Kendi sayfasının tek başlığı — h1 olmalı */}
        <h1 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          Şu anki cihazın <span className="em">ne kadar</span> güçlü?
        </h1>
        <p className="mt-6 text-dim max-w-[56ch] leading-relaxed text-[.95rem]">
          Bu sayfadaki her şey tahmindi — bu değil. Aşağıdaki test şu an kullandığın
          cihazın ekran kartını gerçekten çalıştırır, yükü kırılana kadar artırır ve
          çıkan sonucu ölçer. Yükseltme düşünüyorsan önce elindekini bilmen gerekir.
        </p>
      </Reveal>

      <Reveal delay={110}>
        <Card className="mt-12 p-5 sm:p-9">

  if(!GA4_ID || window.__ga4Yuklendi) return;
  window.__ga4Yuklendi=true;
  window.dataLayer=window.dataLayer||[];
  window.gtag=function(){ window.dataLayer.push(arguments); };
  window.gtag('js',new Date());
  /* send_page_view:false — sayfa görüntülemeyi rota değişiminde biz bildiriyoruz */
  window.gtag('config',GA4_ID,{send_page_view:false, anonymize_ip:true});
  const s=document.createElement('script');
  s.async=true; s.src='https://www.googletagmanager.com/gtag/js?id='+GA4_ID;
  document.head.appendChild(s);
  window.gtag('event','page_view',{page_path:location.pathname, page_title:document.title});
}

/* Şifre değil — aynı cihazı paylaşanlar birbirinin adıyla yazmasın diye
   basit bir kilit. Sunucu olmadığı için gerçek güvenlik mümkün değil,
   arayüzde de bu açıkça yazıyor. */
function pinHash(s){
  let h=5381;
  for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0;
  return h.toString(36);
}

const zamanFarki = ts => {
  const s=Math.max(0,(Date.now()-ts)/1000);
  if(s<60) return 'az önce';
  if(s<3600) return Math.floor(s/60)+' dk önce';
  if(s<86400) return Math.floor(s/3600)+' saat önce';
  return Math.floor(s/86400)+' gün önce';
};
