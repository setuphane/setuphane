function YeniKonu({user,sys,prof,onEkle}){
  const {plain}=useCur();
  const [ac,setAc]=useState(false);
  const [kat,setKat]=useState('tavsiye');
  const [baslik,setBaslik]=useState('');
  const [govde,setGovde]=useState('');
  const [ekle,setEkle]=useState(false);
  const [hata,setHata]=useState('');

  const gonder=()=>{
    if(baslik.trim().length<8){ setHata('Başlık en az 8 karakter olmalı — ne sorduğun anlaşılsın.'); return; }
    if(govde.trim().length<15){ setHata('Biraz daha detay yaz, tek cümleyle kimse yardım edemez.'); return; }
    let g=govde.trim();
    if(ekle && sys){
      g += '\n\n--- SİSTEMİM ---\n'+summaryText(sys,prof,plain);
    }
    olay('forum_konu_acildi',{kategori:kat, sistem_ekli:!!(ekle&&sys)});
    onEkle({id:'k'+Date.now(), kat, baslik:baslik.trim(), govde:g,
            yazar:user.ad, renk:user.renk, ts:Date.now(), cevaplar:[], begeni:0});
    setBaslik(''); setGovde(''); setHata(''); setAc(false); setEkle(false);
  };

  if(!ac) return (
    <button onClick={()=>setAc(true)}
      className="w-full border border-cy/40 text-cy px-6 py-4 lbl hover:bg-cy/[.07] hover:border-cy transition-colors duration-300">
      + YENİ KONU AÇ
    </button>
  );

  return (
    <Card className="p-5 sm:p-7">
      <div className="flex items-center justify-between mb-5">
        <Label>YENİ KONU</Label>
        <button onClick={()=>setAc(false)} className="lbl text-dim hover:text-ink transition-colors">VAZGEÇ</button>
      </div>
      <div className="grid sm:grid-cols-[200px_1fr] gap-4">
        <div>
          <label htmlFor="nkat" className="lbl text-dim block mb-2">KATEGORİ</label>
          <select id="nkat" value={kat} onChange={e=>setKat(e.target.value)} className="w-full px-4 py-3 text-[.9rem]">
            {KATEGORILER.map(k=><option key={k.id} value={k.id}>{k.n}</option>)}
          </select>
        </div>
        <div>
          <label htmlFor="nbas" className="lbl text-dim block mb-2">BAŞLIK</label>
          <input id="nbas" value={baslik} onChange={e=>setBaslik(e.target.value)} maxLength={90}
            placeholder="ör. 60 bin bütçeyle 1440p için ne almalıyım?"
            className="w-full px-4 py-3 bg-transparent border border-line text-ink text-[.95rem] placeholder:text-dim/50 focus:border-cy transition-colors"/>
        </div>
      </div>
      <div className="mt-4">
        <label htmlFor="ngov" className="lbl text-dim block mb-2">ANLATTIKLARIN</label>
        <textarea id="ngov" value={govde} onChange={e=>setGovde(e.target.value)} rows={5} maxLength={4000}
          placeholder="Bütçen, ne yapacağın, ekranın, elindeki parçalar…"
          className="w-full px-4 py-3 bg-transparent border border-line text-ink text-[.95rem] leading-relaxed placeholder:text-dim/50 focus:border-cy transition-colors resize-y"/>
      </div>
      {sys && (
        <label className="mt-4 flex items-start gap-3 cursor-pointer group">
          <input type="checkbox" checked={ekle} onChange={e=>setEkle(e.target.checked)}
            className="mt-1 w-4 h-4 accent-cy shrink-0"/>
          <span className="text-[.88rem] text-dim group-hover:text-ink transition-colors leading-snug">
            Yukarıda kurduğum sistemi gönderiye ekle
            <span className="block text-[.78rem] text-dim/70 mt-0.5">{sys.g.n} + {sys.c.n} · {summaryText(sys,prof,plain).match(/TOPLAM.*/)?.[0]?.replace(/TOPLAM\s*:\s*/,'')}</span>
          </span>
        </label>
      )}
      {hata && <p className="mt-4 text-[.85rem]" style={{color:'#FF2D95'}}>{hata}</p>}
      <button onClick={gonder}
        className="mt-6 border border-cy text-cy px-6 py-3 lbl hover:bg-cy hover:text-bg transition-colors duration-300">
        KONUYU AÇ
      </button>
    </Card>
  );
}

function Konu({k,user,ben,onGuncelle,onSil,onOturumAc}){
  const [ac,setAc]=useState(false);
  const [cevap,setCevap]=useState('');
  const kat=KATEGORILER.find(x=>x.id===k.kat)||KATEGORILER[4];
  /* Uzak modda beğeni cihaz kimliğiyle, yerel modda kullanıcı adıyla tutulur */
  const kimlik = uzakVar() ? ben : (user&&user.ad);
  const begendim = !!kimlik && (k.begenenler||[]).includes(kimlik);

  const cevapla=()=>{
    if(!user || cevap.trim().length<2) return;
    onGuncelle({...k, cevaplar:[...k.cevaplar,
      {id:'c'+Date.now(), yazar:user.ad, renk:user.renk, govde:cevap.trim(), ts:Date.now()}]});
    setCevap('');
  };
  const begen=()=>{
    if(!user||!kimlik) return;
    const l=k.begenenler||[];
    onGuncelle({...k, begenenler: begendim ? l.filter(x=>x!==kimlik) : [...l,kimlik]});
  };

  return (
    <div className="border-b border-line">
      <button onClick={()=>setAc(a=>!a)} aria-expanded={ac} aria-controls={'kn-'+k.id}
        className="w-full text-left py-5 flex items-start gap-4 group">
        <Avatar ad={k.yazar} renk={k.renk}/>
        <span className="flex-1 min-w-0">
          <span className="flex items-center gap-2.5 flex-wrap mb-1.5">
            <span className="lbl px-2 py-1 border" style={{borderColor:'rgba(236,235,242,.14)',color:'#8B88A0'}}>{kat.n}</span>
            {k.sabit && <span className="lbl text-cy">SABİT</span>}
          </span>
          <span className={'block text-[1.05rem] sm:text-[1.2rem] font-light leading-snug transition-colors '+(ac?'text-cy':'text-ink group-hover:text-cy')}>
            {k.baslik}
          </span>
          <span className="block text-[.78rem] text-dim mt-1.5">
            <span style={{color:k.renk}}>{k.yazar}</span> · {zamanFarki(k.ts)} · {k.cevaplar.length} cevap
            {(k.begenenler||[]).length>0 && ` · ${(k.begenenler||[]).length} beğeni`}
          </span>
        </span>
        <span className={'shrink-0 w-7 h-7 grid place-items-center border transition-all duration-500 '+(ac?'border-cy rotate-45':'border-line group-hover:border-ink/30')}>
          <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M6 0v12M0 6h12" stroke={ac?'#2DE2E6':'#8B88A0'} strokeWidth="1.1"/>
          </svg>
        </span>
      </button>

      <div id={'kn-'+k.id} className={'acc '+(ac?'open':'')}>
        <div className="accIn">
          <div className="pb-7 pl-0 sm:pl-12">
            <p className="text-[.95rem] leading-[1.75] text-ink/85 whitespace-pre-wrap break-words">{k.govde}</p>

            <div className="mt-5 flex items-center gap-3 flex-wrap">
              <button onClick={begen} disabled={!user}
                className={'lbl px-4 py-2 border transition-colors disabled:opacity-40 '+(begendim?'border-cy text-cy':'border-line text-dim hover:text-ink')}>
                {begendim?'BEĞENDİN ✓':'BEĞEN'}
              </button>
              {/* Uzak modda silme yok: sunucu tarafında sahiplik doğrulanamıyor,
                  herkese silme yetkisi vermek forumu savunmasız bırakırdı.
                  Moderasyon Supabase panelinden yapılır. */}
              {!uzakVar() && user && (k.yazar===user.ad) && !k.sabit && (
                <button onClick={()=>onSil(k.id)}
                  className="lbl px-4 py-2 border border-line text-dim hover:border-mg/50 transition-colors">
                  KONUYU SİL
                </button>
              )}
            </div>

            {k.cevaplar.length>0 && (
              <ul className="mt-7 space-y-5">
                {k.cevaplar.map(c=>(
                  <li key={c.id} className="flex items-start gap-3">
                    <Avatar ad={c.yazar} renk={c.renk} size={26}/>
                    <div className="min-w-0 flex-1">
                      <div className="text-[.78rem] mb-1">
                        <span style={{color:c.renk}}>{c.yazar}</span>
                        <span className="text-dim"> · {zamanFarki(c.ts)}</span>
                      </div>
                      <p className="text-[.9rem] leading-relaxed text-ink/80 whitespace-pre-wrap break-words">{c.govde}</p>
                    </div>
                  </li>
                ))}
              </ul>
            )}

            {user ? (
              <div className="mt-7">
                <textarea value={cevap} onChange={e=>setCevap(e.target.value)} rows={3} maxLength={2000}
                  placeholder={'Cevabını yaz, '+user.ad+'…'}
                  className="w-full px-4 py-3 bg-transparent border border-line text-ink text-[.92rem] leading-relaxed placeholder:text-dim/50 focus:border-cy transition-colors resize-y"/>
                <button onClick={cevapla} disabled={cevap.trim().length<2}
                  className="mt-3 border border-cy text-cy px-5 py-2.5 lbl hover:bg-cy hover:text-bg transition-colors duration-300 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-cy">
                  CEVAP YAZ
                </button>
              </div>
            ) : (
              /* Aynı akışa bağlı: paneli açar ve sayfayı ona kaydırır.
                 Önceden "yukarıdan bir ad seç" diyen ölü bir metindi. */
              <button onClick={onOturumAc}
                className="mt-7 lbl px-5 py-3 border border-cy/40 text-cy hover:bg-cy/[.07] hover:border-cy transition-colors duration-300">
                CEVAP YAZMAK İÇİN OTURUM AÇ
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Forum({sys,prof}){
  const [user,setUser]=useState(()=>userLoad());
  const [data,setData]=useState(()=>uzakVar()?{konular:[]}:forumLoad());
  const [filtre,setFiltre]=useState('hepsi');
  const [bildirim,setBildirim]=useState('');
  const [yukleniyor,setYukleniyor]=useState(uzakVar());
  const [uzakHata,setUzakHata]=useState(null);
  const [kimlikAcik,setKimlikAcik]=useState(false);
  const kimlikRef=useRef(null);
  /* Tek giriş noktası: nerede "oturum aç" yazsa buraya bağlanıyor —
     paneli açar ve sayfayı ona kaydırır. */
  const oturumAc=useCallback(()=>{
    setKimlikAcik(true);
    setTimeout(()=>{
      const el=kimlikRef.current;
      if(el) el.scrollIntoView({behavior:reduced()?'auto':'smooth', block:'center'});
    },60);
  },[]);
  const dosyaRef=useRef(null);
  const ben=cihazId();

  /* Yerel modda diske yaz; uzak modda sunucu zaten kaynak. */
  useEffect(()=>{ if(!uzakVar()) forumSave(data); },[data]);

  const uzaktanCek=useCallback(async()=>{
    try{
      setYukleniyor(true);
      const [kon,cev,beg]=await Promise.all([
        sb('konular?select=id,kat,baslik,govde,yazar,renk,sabit,olusturma&order=olusturma.desc&limit=200'),
        sb('cevaplar?select=id,konu_id,govde,yazar,renk,olusturma&order=olusturma.asc&limit=1000'),
        sb('begeniler?select=konu_id,cihaz&limit=2000'),
      ]);
      const konular=kon.map(k=>({
        id:k.id, kat:k.kat, baslik:k.baslik, govde:k.govde, yazar:k.yazar, renk:k.renk,
        sabit:!!k.sabit, ts:new Date(k.olusturma).getTime(),
        cevaplar:cev.filter(c=>c.konu_id===k.id).map(c=>({
          id:c.id, govde:c.govde, yazar:c.yazar, renk:c.renk, ts:new Date(c.olusturma).getTime()})),
        begenenler:beg.filter(b=>b.konu_id===k.id).map(b=>b.cihaz),
      }));
      setData({konular}); setUzakHata(null);
    }catch(e){ setUzakHata(e.message); }
    finally{ setYukleniyor(false); }
  },[]);

  useEffect(()=>{ if(uzakVar()) uzaktanCek(); },[uzaktanCek]);

  const guncelle = async k => {
    setData(d=>({...d, konular:d.konular.map(x=>x.id===k.id?k:x)}));   /* iyimser güncelleme */
    if(!uzakVar()) return;
    try{
      const oncekiBegeni=(data.konular.find(x=>x.id===k.id)||{}).begenenler||[];
      const yeniBegeni=k.begenenler||[];
      if(yeniBegeni.includes(ben) && !oncekiBegeni.includes(ben))
        await sb('begeniler',{method:'POST',body:{konu_id:k.id,cihaz:ben},prefer:'return=minimal'});
      else if(!yeniBegeni.includes(ben) && oncekiBegeni.includes(ben))
        await sb('begeniler?konu_id=eq.'+k.id+'&cihaz=eq.'+encodeURIComponent(ben),{method:'DELETE',prefer:'return=minimal'});
      const eskiCev=((data.konular.find(x=>x.id===k.id)||{}).cevaplar||[]).length;
      if(k.cevaplar.length>eskiCev){
        const y=k.cevaplar[k.cevaplar.length-1];
        const kayit=await sb('cevaplar',{method:'POST',
          body:{konu_id:k.id,govde:y.govde,yazar:y.yazar,renk:y.renk,cihaz:ben}});
        if(kayit&&kayit[0]) uzaktanCek();
      }
    }catch(e){ setBildirim('Gönderilemedi: '+e.message); setTimeout(()=>setBildirim(''),4000); uzaktanCek(); }
  };

  const sil = async id => {
    setData(d=>({...d, konular:d.konular.filter(x=>x.id!==id)}));
    if(uzakVar()){ try{ await sb('konular?id=eq.'+id,{method:'DELETE',prefer:'return=minimal'}); }catch(e){ uzaktanCek(); } }
  };

  const ekle = async k => {
    if(!uzakVar()){ setData(d=>({...d, konular:[k,...d.konular]})); return; }
    try{
      const kayit=await sb('konular',{method:'POST',
        body:{kat:k.kat,baslik:k.baslik,govde:k.govde,yazar:k.yazar,renk:k.renk,cihaz:ben}});
      if(kayit&&kayit[0]) uzaktanCek();
    }catch(e){ setBildirim('Konu açılamadı: '+e.message); setTimeout(()=>setBildirim(''),4000); }
  };

  const disaAktar=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='setuphane-forum-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    setBildirim('Dosya indirildi.'); setTimeout(()=>setBildirim(''),2500);
  };
  const iceAktar=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const g=JSON.parse(r.result);
        if(!g||!Array.isArray(g.konular)) throw new Error('bicim');
        /* Aynı konu iki kez eklenmesin */
        const mevcut=new Set(data.konular.map(k=>k.id));
        const yeni=g.konular.filter(k=>!mevcut.has(k.id));
        setData(d=>({...d, konular:[...yeni,...d.konular]}));
        setBildirim(yeni.length+' yeni konu eklendi.');
      }catch(err){ setBildirim('Dosya okunamadı — SETUP HANE forum dosyası mı?'); }
      setTimeout(()=>setBildirim(''),3500);
    };
    r.readAsText(f);
    e.target.value='';
  };

  const liste = (filtre==='hepsi' ? data.konular : data.konular.filter(k=>k.kat===filtre))
    .slice().sort((a,b)=>(b.sabit?1:0)-(a.sabit?1:0) || b.ts-a.ts);

  return (
    <section id="forum" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 06 — TOPLULUK</Label>
        <div className="rule mb-10"/>
        <h1 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          Kafana takılanı <span className="em">sor</span>.
        </h1>
        <p className="mt-6 text-dim max-w-[56ch] leading-relaxed text-[.95rem]">
          Kurucu sana bir sistem verir ama her sorunun cevabı formülde yoktur.
          Bir kullanıcı adı seç, konu aç, kurduğun sistemi tek tuşla gönderine ekle.
        </p>
      </Reveal>

      {/* Kimlik: tek satırlık şerit. Eskiden kocaman bir kayıt formu en üstteydi
          ve mobilde tek konu görmeden 1400 piksel scroll gerekiyordu —
          içerik kayıt formunun altında gömülüydü. Artık form yalnızca
          gerektiğinde açılıyor. */}
      <Reveal delay={110}>
        <div ref={kimlikRef} className="mt-10 flex flex-wrap items-center justify-between gap-3 py-3 border-y border-line scroll-mt-[140px]">
          {user ? (
            <>
              <span className="flex items-center gap-3 min-w-0">
                <Avatar ad={user.ad} renk={user.renk} size={30}/>
                <span className="text-[.92rem] truncate" style={{color:user.renk}}>{user.ad}</span>
              </span>
              <button onClick={()=>{ setUser(null); userSave(null); setKimlikAcik(false); }}
                className="lbl text-dim hover:text-ink transition-colors">ÇIKIŞ</button>
            </>
          ) : (
            <>
              <span className="text-[.88rem] text-dim">Okumak serbest — yazmak için oturum aç.</span>
              <button onClick={()=>kimlikAcik?setKimlikAcik(false):oturumAc()}
                className={'lbl px-4 py-2 border transition-colors '+(kimlikAcik?'border-cy text-cy':'border-line text-dim hover:text-ink')}>
                {kimlikAcik?'KAPAT':'OTURUM AÇ'}
              </button>
            </>
          )}
        </div>
      </Reveal>

      {!user && (
        <div className={'acc '+(kimlikAcik?'open':'')}>
          <div className="accIn">
            <Card className="mt-4 p-5 sm:p-7">
              <GirisKarti user={user} setUser={u=>{ setUser(u); setKimlikAcik(false); }}/>
            </Card>
          </div>
        </div>
      )}

      <Reveal delay={150}>
        {uzakHata ? (
          <div className="mt-5 p-4 border flex items-start gap-3"
               style={{borderColor:'rgba(255,45,149,.35)',background:'rgba(255,45,149,.06)'}}>
            <span className="w-2 h-2 rotate-45 shrink-0 mt-1.5" style={{background:'#FF2D95'}}/>
            <p className="text-[.85rem] text-ink/80 leading-relaxed">
              <span className="text-mg">Sunucuya ulaşılamadı.</span> Gönderiler geçici olarak
              görüntülenemiyor. Bağlantını kontrol edip sayfayı yenile.
              <span className="block text-[.75rem] text-dim mt-1.5 break-words">{uzakHata}</span>
            </p>
          </div>
        ) : uzakVar() ? (
          <p className="mt-4 text-[.82rem] text-dim leading-relaxed">
            <span className="text-cy">Burası ortak alan</span> — yazdıklarını herkes görür ve
            silinmez. Telefon, adres, sipariş numarası gibi kişisel bilgi yazma.
          </p>
        ) : (
          <div className="mt-5 p-4 border border-cy/25 bg-cy/[.05] flex items-start gap-3">
            <span className="w-2 h-2 rotate-45 shrink-0 mt-1.5 bg-cy"/>
            <p className="text-[.85rem] text-ink/80 leading-relaxed">
              <span className="text-cy">Bu forum senin cihazında çalışıyor.</span>{' '}
              Yazdıkların tarayıcında kalır, internete gitmez, başkası göremez.
              Paylaşmak istersen aşağıdan dosya olarak dışa aktarabilirsin.
            </p>
          </div>
        )}
      </Reveal>

      <Reveal delay={190}>
        <div className="mt-6">{user
          ? <YeniKonu user={user} sys={sys} prof={prof} onEkle={ekle}/>
          : <button onClick={oturumAc}
              className="w-full border border-cy/40 text-cy px-6 py-4 lbl hover:bg-cy/[.07] hover:border-cy transition-colors duration-300">
              + YENİ KONU AÇ
            </button>}
        </div>
      </Reveal>

      <Reveal delay={220}>
        <div className="mt-8 flex flex-wrap gap-2">
          {[{id:'hepsi',n:'Hepsi'},...KATEGORILER].map(k=>{
            const on=filtre===k.id;
            const say=k.id==='hepsi'?data.konular.length:data.konular.filter(x=>x.kat===k.id).length;
            return (
              <button key={k.id} onClick={()=>setFiltre(k.id)} aria-pressed={on}
                className={'lbl px-4 py-2.5 border transition-colors duration-300 '+(on?'border-cy text-cy bg-cy/[.07]':'border-line text-dim hover:text-ink')}>
                {k.n} <span className="num opacity-60 ml-1">{say}</span>
              </button>
            );
          })}
        </div>
      </Reveal>

      <Reveal delay={250}>
        <div className="mt-6 border-t border-line">
          {yukleniyor
            ? <p className="py-10 text-[.9rem] text-dim">Konular yükleniyor…</p>
            : liste.length===0
              ? <p className="py-10 text-[.9rem] text-dim">Bu kategoride henüz konu yok. İlk açan sen ol.</p>
              : liste.map(k=><Konu key={k.id} k={k} user={user} ben={ben}
                              onGuncelle={guncelle} onSil={sil} onOturumAc={oturumAc}/>)}
        </div>
      </Reveal>

      <Reveal delay={280}>
        <div className={'mt-8 flex flex-wrap items-center gap-3 '+(uzakVar()?'hidden':'')}>
          <button onClick={disaAktar}
            className="lbl px-5 py-2.5 border border-line text-dim hover:text-ink hover:border-ink/30 transition-colors">
            DIŞA AKTAR
          </button>
          <button onClick={()=>dosyaRef.current&&dosyaRef.current.click()}
            className="lbl px-5 py-2.5 border border-line text-dim hover:text-ink hover:border-ink/30 transition-colors">
            İÇE AKTAR
          </button>
          <input ref={dosyaRef} type="file" accept="application/json,.json" onChange={iceAktar}
                 aria-label="Forum yedek dosyası seç" className="hidden"/>
          {bildirim && <span className="lbl text-cy">{bildirim}</span>}
        </div>
      </Reveal>
    </section>
  );
}

/* ═══════════════════ MODÜL 07 — EKRAN TESTİ ═══════════════════
   İkinci el monitör alan herkesin ihtiyacı: ölü piksel, hayalet iz, renk
   bantlaşması. Tam ekran API'si varsa onu kullanır, yoksa kaplama olarak açar. */
const EKRAN_TESTLERI=[
  {id:'olu',  n:'Ölü piksel', d:'Ekranı tek renge boyar. Yanlış renkte kalan nokta arıyorsun: siyahta parlayan (takılı piksel) ya da beyazda kararan (ölü piksel). Renk değiştirmek için tıkla.'},
  {id:'bant', n:'Renk geçişi', d:'Yumuşak olması gereken geçişte şerit şerit basamaklar görüyorsan panel renk derinliği düşük demektir. Ucuz panellerde sık görülür.'},
  {id:'iz',   n:'Hayalet iz',  d:'Kayan kutunun arkasında soluk bir gölge kalıyorsa panelin tepki süresi yavaştır. Hızlı oyunlarda bulanıklık olarak hissedilir.'},
  {id:'esit', n:'Işık eşitliği', d:'Koyu gri zeminde köşelerin ortadan belirgin açık olması "arka ışık sızması"dır. Karanlık odada film izlerken göze batar.'},
];
function EkranTesti(){
  const [aktif,setAktif]=useState(null);
  const [renkIdx,setRenkIdx]=useState(0);
  const [hiz,setHiz]=useState(6);
  const [hz,setHz]=useState(null);
  const kutuRef=useRef(null);
  const kapla=useRef(null);
  const RENKLER=[['#FF0000','Kırmızı'],['#00FF00','Yeşil'],['#0000FF','Mavi'],
                 ['#FFFFFF','Beyaz'],['#000000','Siyah'],['#808080','Orta gri']];

  useEffect(()=>{ measureHz().then(setHz); },[]);

  /* Hayalet iz testi: kutuyu seçilen hızda yatay kaydır */
  useEffect(()=>{
    if(aktif!=='iz') return;
    let raf, t0=performance.now();
    const tik=t=>{
      const el=kutuRef.current;
      if(el){
        const w=(kapla.current?kapla.current.clientWidth:window.innerWidth)-140;
        const p=((t-t0)/1000*hiz*120)%(w*2);
        el.style.transform=`translateX(${p<w?p:w*2-p}px)`;
      }
      raf=requestAnimationFrame(tik);
    };
    raf=requestAnimationFrame(tik);
    return()=>cancelAnimationFrame(raf);
  },[aktif,hiz]);

  useEffect(()=>{
    if(!aktif) return;
    const esc=e=>{ if(e.key==='Escape') setAktif(null); };
    window.addEventListener('keydown',esc);
    document.body.style.overflow='hidden';
    return()=>{ window.removeEventListener('keydown',esc); document.body.style.overflow=''; };
  },[aktif]);

  const kaplamaIcerik=()=>{
    if(aktif==='olu') return <div className="absolute inset-0" style={{background:RENKLER[renkIdx][0]}}/>;
    if(aktif==='bant') return <div className="absolute inset-0" style={{background:'linear-gradient(90deg,#000,#fff)'}}/>;
    if(aktif==='esit') return <div className="absolute inset-0" style={{background:'#1a1a1a'}}/>;
    if(aktif==='iz') return (
      <div className="absolute inset-0" style={{background:'#111'}}>
        <div ref={kutuRef} className="absolute top-1/2 -translate-y-1/2 left-[70px]"
             style={{width:90,height:90,background:'#fff',willChange:'transform'}}/>
      </div>
    );
    return null;
  };

  return (
    <section id="ekran" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 07 — EKRAN TESTİ</Label>
        <div className="rule mb-10"/>
        <h1 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          Ekranın <span className="em">sağlam</span> mı?
        </h1>
        <p className="mt-6 text-dim max-w-[58ch] leading-relaxed text-[.95rem]">
          İkinci el monitör alırken ya da yeni ekranı kutudan çıkarınca ilk yapılacak iş budur.
          Dört testi de yerinde çalıştır — kusur varsa iade süresi dolmadan görürsün.
        </p>
      </Reveal>

      <Reveal delay={110}>
        <Card className="mt-12 p-5 sm:p-9">
          <div className="flex flex-wrap items-center gap-x-8 gap-y-3 pb-7 mb-7 border-b border-line">
            <div>
              <div className="lbl text-dim mb-1.5">EKRAN ÇÖZÜNÜRLÜĞÜN</div>
              <div className="num text-[1.1rem]">{screen.width}×{screen.height}</div>
            </div>
            <div>
              <div className="lbl text-dim mb-1.5">YENİLEME HIZI</div>
              <div className="num text-[1.1rem] text-cy">{hz===null?'ölçülemedi':hz?hz+' Hz':'…'}</div>
            </div>
            {hz>0 && (
              <p className="text-[.85rem] text-dim leading-relaxed max-w-[38ch]">
                {hz>=100 ? 'Yüksek yenileme hızlı ekran — hızlı oyunlarda avantaj.'
                         : 'Standart 60 Hz sınıfı. Oyunda 60 FPS üstü kazanç sağlamaz.'}
              </p>
            )}
          </div>

          <div className="grid sm:grid-cols-2 gap-4">
            {EKRAN_TESTLERI.map(t=>(
              <div key={t.id} className="p-5 border border-line">
                <h3 className="text-[1.15rem] font-light mb-2.5">{t.n}</h3>
                <p className="text-[.86rem] text-dim leading-relaxed mb-5">{t.d}</p>
                <button onClick={()=>{ setRenkIdx(0); setAktif(t.id); olay('ekran_testi',{tur:t.id}); }}
                  className="lbl px-5 py-2.5 border border-cy text-cy hover:bg-cy hover:text-bg transition-colors duration-300">
                  BAŞLAT
                </button>
              </div>
            ))}
          </div>
          <p className="mt-7 text-[.72rem] text-dim leading-relaxed">
            Testten çıkmak için <span className="text-ink">Esc</span>'e bas ya da sağ üstteki kapat düğmesini kullan.
          </p>
        </Card>
      </Reveal>

      {aktif && (
        <div ref={kapla} className="fixed inset-0 z-[95] cursor-pointer"
             onClick={()=>{ if(aktif==='olu') setRenkIdx(i=>(i+1)%RENKLER.length); }}>
          {kaplamaIcerik()}
          <div className="absolute top-4 right-4 flex items-center gap-3 z-10">
            {aktif==='olu' && (
              <span className="lbl px-3 py-2" style={{background:'rgba(0,0,0,.55)',color:'#fff'}}>
                {RENKLER[renkIdx][1]} · {renkIdx+1}/{RENKLER.length} · TIKLA
              </span>
            )}
            {aktif==='iz' && (
              <span className="flex items-center gap-2 px-3 py-2" style={{background:'rgba(0,0,0,.55)'}}>
                <span className="lbl text-white/70">HIZ</span>
                <input type="range" min={2} max={14} value={hiz} onClick={e=>e.stopPropagation()}
                  onChange={e=>setHiz(+e.target.value)} className="w-24" aria-label="Kutu hızı"/>
              </span>
            )}
            <button onClick={e=>{e.stopPropagation(); setAktif(null);}}
              className="lbl px-4 py-2 border border-white/40 text-white hover:bg-white hover:text-black transition-colors"
              style={{background:'rgba(0,0,0,.55)'}}>KAPAT ✕</button>
          </div>
        </div>
      )}
    </section>
  );
}

/* ═══════════════════ MODÜL 08 — NİŞAN OYUNU ═══════════════════
   Eğlenceli ama işe yarar: tepki süreni ölçer ve yüksek FPS/Hz'in neden
   fark yarattığını somut bir sayıyla gösterir. */
const NISAN_KEY='sh_nisan_v1';
function NisanOyunu(){
  const alanRef=useRef(null);
  const [durum,setDurum]=useState('hazir');   /* hazir | oynuyor | bitti */
  const [hedef,setHedef]=useState(null);
  const [kalan,setKalan]=useState(30);
  const [vurus,setVurus]=useState(0);
  const [kacan,setKacan]=useState(0);
  const [sureler,setSureler]=useState([]);
  const [rekor,setRekor]=useState(()=>{ try{ return JSON.parse(localStorage.getItem(NISAN_KEY))||null; }catch(e){ return null; } });
  const [hz,setHz]=useState(null);
  const zamanlayici=useRef(null);
  const belirdi=useRef(0);

  useEffect(()=>{ measureHz().then(setHz); return()=>clearInterval(zamanlayici.current); },[]);

  const yeniHedef=()=>{
    const el=alanRef.current; if(!el) return;
    const r=el.getBoundingClientRect();
    const cap=Math.max(34,Math.min(64,r.width*0.09));
    setHedef({
      x: Math.random()*(r.width-cap), y: Math.random()*(r.height-cap), cap,
      id: Math.random().toString(36).slice(2)
    });
    belirdi.current=performance.now();
  };

  const basla=()=>{
    setVurus(0); setKacan(0); setSureler([]); setKalan(30); setDurum('oynuyor');
    yeniHedef();
    clearInterval(zamanlayici.current);
    zamanlayici.current=setInterval(()=>{
      setKalan(k=>{
        if(k<=1){ clearInterval(zamanlayici.current); setDurum('bitti'); setHedef(null); return 0; }
        return k-1;
      });
    },1000);
  };

  const vur=e=>{
    e.stopPropagation();
    setSureler(s=>[...s, performance.now()-belirdi.current]);
    setVurus(v=>v+1);
    yeniHedef();
  };
  const isla=()=>{ if(durum==='oynuyor') setKacan(k=>k+1); };

  const ortalama = sureler.length ? Math.round(sureler.reduce((a,b)=>a+b,0)/sureler.length) : 0;
  const enIyi    = sureler.length ? Math.round(Math.min.apply(null,sureler)) : 0;
  const isabet   = (vurus+kacan) ? Math.round(vurus/(vurus+kacan)*100) : 0;
  const puan     = vurus>0 ? Math.round(vurus*100 - ortalama/2 - kacan*30) : 0;

  useEffect(()=>{
    if(durum!=='bitti' || vurus===0) return;
    if(!rekor || puan>rekor.puan){
      const y={puan, vurus, ortalama, isabet, ts:Date.now()};
      setRekor(y);
      try{ localStorage.setItem(NISAN_KEY,JSON.stringify(y)); }catch(e){}
    }
  },[durum]);

  const puanA=useCount(durum==='bitti'?puan:0);

  return (
    <section id="nisan" className="py-16 lg:py-24 scroll-mt-24">
      <Reveal>
        <Label className="mb-4">MODÜL 08 — NİŞAN OYUNU</Label>
        <div className="rule mb-10"/>
        <h1 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[16ch]">
          Refleksin <span className="em">kaç</span> milisaniye?
        </h1>
        <p className="mt-6 text-dim max-w-[58ch] leading-relaxed text-[.95rem]">
          30 saniye, çıkan hedeflere tıkla. Sonunda ortalama tepki süreni göreceksin —
          ve o sürenin yanında ekranının kaç milisaniye geciktirdiğini.
        </p>
      </Reveal>

      <Reveal delay={110}>
        <Card className="mt-12 p-5 sm:p-7">
          <div className="flex flex-wrap items-center justify-between gap-x-8 gap-y-4 mb-5">
            <div className="flex flex-wrap gap-x-8 gap-y-3">
              {[['SÜRE',kalan+' sn'],['VURUŞ',vurus],['KAÇAN',kacan],
                ['ORTALAMA',ortalama?ortalama+' ms':'—']].map(([k,v])=>(
                <div key={k}>
                  <div className="lbl text-dim mb-1">{k}</div>
                  <div className="num text-[1.25rem]">{v}</div>
                </div>
              ))}
            </div>
            <button onClick={basla}
              className="lbl px-6 py-3 border border-cy text-cy hover:bg-cy hover:text-bg transition-colors duration-300">
              {durum==='oynuyor'?'YENİDEN BAŞLAT':'BAŞLA'}
            </button>
          </div>

          <div ref={alanRef} onClick={isla}
            className="relative w-full h-[340px] sm:h-[420px] border border-line overflow-hidden select-none"
            style={{background:'radial-gradient(120% 90% at 50% 0%, #14141d 0%, #0a0a10 70%)',
                    cursor: durum==='oynuyor'?'crosshair':'default'}}>
            {durum==='hazir' && (
              <div className="absolute inset-0 grid place-items-center text-center px-6">
                <p className="text-[.95rem] text-dim max-w-[34ch] leading-relaxed">
                  Başla'ya bas. Hedefler rastgele belirecek — ne kadar hızlı tıklarsan o kadar iyi.
                  Boşa tıklamak puan kırar.
                </p>
              </div>
            )}
            {hedef && durum==='oynuyor' && (
              <button key={hedef.id} onClick={vur} aria-label="Hedef"
                className="absolute grid place-items-center"
                style={{left:hedef.x,top:hedef.y,width:hedef.cap,height:hedef.cap,borderRadius:'50%',
                        border:'2px solid #2DE2E6',background:'rgba(45,226,230,.16)',
                        boxShadow:'0 0 22px rgba(45,226,230,.55)'}}>
                <span style={{width:'28%',height:'28%',borderRadius:'50%',background:'#2DE2E6'}}/>
              </button>
            )}
            {durum==='bitti' && (
              <div className="absolute inset-0 grid place-items-center px-6"
                   style={{background:'rgba(7,7,11,.82)'}}>
                <div className="text-center">
                  <div className="lbl text-dim mb-3">PUANIN</div>
                  <div className="num text-[3.4rem] font-light leading-none text-cy mb-6">{Math.round(puanA)}</div>
                  <div className="flex flex-wrap justify-center gap-x-8 gap-y-3">
                    {[['Vuruş',vurus],['İsabet','%'+isabet],['Ortalama',ortalama+' ms'],['En hızlı',enIyi+' ms']].map(([k,v])=>(
                      <div key={k}>
                        <div className="lbl text-dim mb-1">{k}</div>
                        <div className="num text-[1.05rem]">{v}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>

          {(durum==='bitti'||rekor) && (
            <div className="mt-7 pt-7 border-t border-line grid sm:grid-cols-2 gap-7">
              {rekor && (
                <div>
                  <div className="lbl text-dim mb-2">BU CİHAZDAKİ REKORUN</div>
                  <div className="num text-[1.6rem] text-cy leading-none">{rekor.puan}</div>
                  <div className="text-[.82rem] text-dim mt-2">
                    {rekor.vurus} vuruş · %{rekor.isabet} isabet · {rekor.ortalama} ms
                  </div>
                </div>
              )}
              {durum==='bitti' && ortalama>0 && hz>0 && (
                <div>
                  <div className="lbl text-dim mb-2">EKRANIN NE KADAR GECİKTİRİYOR</div>
                  <p className="text-[.9rem] leading-relaxed text-ink/85">
                    Tepkin <span className="num text-cy">{ortalama} ms</span>.
                    {' '}{hz} Hz ekranda görüntü sana ortalama{' '}
                    <span className="num text-cy">{Math.round(1000/hz/2)} ms</span> gecikmeyle ulaşır —
                    yani tepkinin yaklaşık <span className="num">%{Math.round((1000/hz/2)/ortalama*100)}</span>'i kadar.
                    {hz<100 && ' 144 Hz ekranda bu gecikme yarıdan aza iner.'}
                  </p>
                </div>
              )}
            </div>
          )}
        </Card>
      </Reveal>
    </section>
  );
}

/* ═══════════════════ FPS TESTİ — canvas parçacık yükü ═══════════════════
   GPU gücü testinden farkı: bu, tarayıcının SAYFA ÇİZME hızını ölçer (rAF,
   yani vsync'e bağlı). Oyundaki FPS hissinin karşılığı budur; %1 düşük ve
   tutarlılık takılma hissini ortalamadan daha iyi anlatır.
   Eski sürüm sadece küçük daireler çiziyordu — 9000 tanesi bile Skia'nın
   2D hızlandırmasıyla hemen hiçbir kartı zorlamıyordu. Şimdi sayı çok daha
   yüksek VE üst seviyelerde ctx.shadowBlur açık: Canvas 2D'nin en pahalı
   işlemlerinden biri, her parçacığı gerçek bir glow render'ına çeviriyor.
   Zayıf/entegre ekran kartları "yüksek/ekstrem"de artık gerçekten düşüyor. */
const FPS_YOGUNLUK=[
  {id:'dusuk',  n:'Düşük',   p:1500, r:2,   blur:0},
  {id:'hafif',  n:'Hafif',   p:5000, r:2.6, blur:0},
  {id:'orta',   n:'Orta',    p:11000,r:3.2, blur:6},
  {id:'yuksek', n:'Yüksek',  p:20000,r:4,   blur:12},
  {id:'ekstrem',n:'Ekstrem', p:34000,r:5,   blur:20},
];
const FPS_GECMIS_KEY='sh_fpstest_v1';

function FpsTesti(){
  const cvRef=useRef(null);
  const [sure,setSure]=useState(30);
  const [yog,setYog]=useState('orta');
  const [calisiyor,setCalisiyor]=useState(false);
  const [kalan,setKalan]=useState(30);
  const [anlik,setAnlik]=useState(0);
  const [son,setSon]=useState(null);
  const [hz,setHz]=useState(null);
  const [gecmis,setGecmis]=useState(()=>{ try{return JSON.parse(localStorage.getItem(FPS_GECMIS_KEY))||[];}catch(e){return [];} });
  const dur=useRef(false);

  useEffect(()=>{ measureHz().then(setHz); return()=>{dur.current=true}; },[]);

  const basla=()=>{
    const cv=cvRef.current; if(!cv) return;
    const ctx=cv.getContext('2d');
    /* Eskiden 2'de kesiliyordu; yüksek DPR ekranlarda (telefon/4K dizüstü)
       gerçek zorluk çözünürlükle orantılı olmalı — 3'e kadar izin veriyoruz. */
    const dpr=Math.min(3,window.devicePixelRatio||1);
    const W=cv.clientWidth, H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.scale(dpr,dpr);

    const cfg=FPS_YOGUNLUK.find(y=>y.id===yog);
    const par=[];
    for(let i=0;i<cfg.p;i++) par.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*90, vy:(Math.random()-.5)*90,
      r:cfg.r*(0.75+Math.random()*0.5), h:Math.random()
    });

    setCalisiyor(true); setSon(null); setKalan(sure);
    dur.current=false;
    const kareler=[];
    let onceki=performance.now();
    const t0=onceki;

    const tik=t=>{
      const dt=t-onceki; onceki=t;
      if(dt>0&&dt<500) kareler.push(dt);
      const gecen=(t-t0)/1000;
      setKalan(Math.max(0,Math.ceil(sure-gecen)));
      if(kareler.length%10===0 && dt>0) setAnlik(Math.round(1000/dt));

      ctx.shadowBlur=0;
      ctx.fillStyle='#07070B'; ctx.fillRect(0,0,W,H);
      /* shadowBlur, Canvas 2D'nin en pahalı işlemlerinden biri — her
         parçacığı gerçek bir bulanık glow'a çeviriyor, gerçek GPU/CPU
         kompozisyon yükü demek. 0 iken (düşük/hafif) neredeyse bedava. */
      ctx.shadowBlur=cfg.blur;
      const s=Math.min(dt,50)/1000;
      for(let i=0;i<par.length;i++){
        const p=par[i];
        p.x+=p.vx*s; p.y+=p.vy*s;
        if(p.x<0||p.x>W) p.vx*=-1;
        if(p.y<0||p.y>H) p.vy*=-1;
        const cy=p.h<.5;
        ctx.fillStyle = cy ? 'rgba(45,226,230,.75)' : 'rgba(255,45,149,.7)';
        if(cfg.blur) ctx.shadowColor = cy ? '#2DE2E6' : '#FF2D95';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
      }

      if(gecen<sure && !dur.current) requestAnimationFrame(tik);
      else bitir(kareler);
    };
    requestAnimationFrame(tik);
  };

  const bitir=kareler=>{
    setCalisiyor(false);
    if(kareler.length<10){ return; }
    const fps=kareler.map(d=>1000/d).sort((a,b)=>a-b);
    const ort=fps.reduce((a,b)=>a+b,0)/fps.length;
    /* %1 düşük: en kötü %1'in ortalaması — takılma hissinin gerçek ölçüsü */
    const n1=Math.max(1,Math.floor(fps.length*0.01));
    const dusuk1=fps.slice(0,n1).reduce((a,b)=>a+b,0)/n1;
    const kareOrt=kareler.reduce((a,b)=>a+b,0)/kareler.length;
    /* Tutarlılık: kare sürelerinin sapması ne kadar küçükse o kadar akıcı */
    const varyans=kareler.reduce((a,d)=>a+Math.pow(d-kareOrt,2),0)/kareler.length;
    const tutar=Math.max(0,Math.round(100-(Math.sqrt(varyans)/kareOrt)*100));
    const dusus=kareler.filter(d=>d>kareOrt*1.7).length;
    const r={ ort:Math.round(ort), dusuk1:Math.round(dusuk1),
              min:Math.round(fps[0]), max:Math.round(fps[fps.length-1]),
              kare:Math.round(kareOrt*100)/100, tutar, dusus,
              sure, yog:FPS_YOGUNLUK.find(y=>y.id===yog).n, ts:Date.now() };
    setSon(r);
    setGecmis(g=>{ const y=[r,...g].slice(0,5); try{localStorage.setItem(FPS_GECMIS_KEY,JSON.stringify(y));}catch(e){} return y; });
  };

  const ortA=useCount(son?son.ort:0), d1A=useCount(son?son.dusuk1:0);

  return (
    <div>
      <div className="grid sm:grid-cols-2 gap-6 mb-7">
        {/* Eşit genişlikli ızgara: 'flex flex-wrap' düğmeleri metin uzunluğuna
            göre boyutlandırdığı için mobilde 3+2 kırılıyor ve satırlar hizasız
            görünüyordu. Izgarada 3+2 kırılma da düzenli duruyor. */}
        <div>
          <div className="lbl text-dim mb-3">TEST SÜRESİ</div>
          <div className="grid grid-cols-3 gap-2">
            {[15,30,60].map(s=>(
              <button key={s} onClick={()=>{setSure(s);setKalan(s);}} disabled={calisiyor} aria-pressed={sure===s}
                className={'lbl text-center px-2 py-2.5 border transition-colors disabled:opacity-40 '+(sure===s?'border-cy text-cy bg-cy/[.07]':'border-line text-dim hover:text-ink')}>
                {s} SN
              </button>
            ))}
          </div>
        </div>
        <div>
          <div className="lbl text-dim mb-3">YÜK YOĞUNLUĞU</div>
          <div className="grid grid-cols-3 gap-2">
            {FPS_YOGUNLUK.map(y=>(
              <button key={y.id} onClick={()=>setYog(y.id)} disabled={calisiyor} aria-pressed={yog===y.id}
                className={'lbl text-center px-2 py-2.5 border transition-colors disabled:opacity-40 '+(yog===y.id?'border-cy text-cy bg-cy/[.07]':'border-line text-dim hover:text-ink')}>
                {y.n}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Etiket kutuları sabit yükseklikte: "—" ile "180 Hz" farklı yükseklik
          verdiği için satırlar birbirine göre kayık duruyordu. */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-6 gap-y-5 pb-6 mb-6 border-b border-line">
        {[['ANLIK FPS',calisiyor?anlik:(son?son.ort:'—')],
          ['YENİLEME HIZI',hz?hz+' Hz':'—'],
          ['ORTALAMA',son?son.ort:'—'],
          ['KALAN',kalan+' sn']].map(([k,v])=>(
          <div key={k}>
            <div className="lbl text-dim mb-1.5 h-[13px] leading-[13px]">{k}</div>
            <div className="num text-[1.5rem] font-light text-cy leading-[1.7rem] h-[1.7rem]">{v}</div>
          </div>
        ))}
      </div>

      <canvas ref={cvRef} className="w-full h-[260px] sm:h-[340px] border border-line block"
              style={{background:'#07070B'}} aria-label="FPS testi çizim alanı"/>

      <button onClick={basla} disabled={calisiyor}
        className="mt-5 border border-cy text-cy px-6 py-3.5 lbl hover:bg-cy hover:text-bg transition-colors duration-300 disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-cy">
        {calisiyor?'ÇALIŞIYOR…':'TESTİ BAŞLAT'}
      </button>

      {son && (
        <div className="mt-8 pt-7 border-t border-line">
          <div className="lbl text-dim mb-5">ANALİZ RAPORU</div>
          <div className="grid sm:grid-cols-3 gap-6 mb-7">
            <div>
              <div className="lbl text-dim mb-2">ORTALAMA FPS</div>
              <div className="num text-[2.6rem] font-light leading-none text-cy">{Math.round(ortA)}</div>
            </div>
            <div>
              <div className="lbl text-dim mb-2">%1 DÜŞÜK</div>
              <div className="num text-[2.6rem] font-light leading-none"
                   style={{color: son.dusuk1 < son.ort*0.55 ? '#FF2D95' : son.dusuk1 < son.ort*0.75 ? '#ECEBF2' : '#2DE2E6'}}>{Math.round(d1A)}</div>
            </div>
            <div>
              <div className="lbl text-dim mb-2">TUTARLILIK</div>
              <div className="num text-[2.6rem] font-light leading-none"
                   style={{color: son.tutar>=90?'#2DE2E6':son.tutar>=75?'#ECEBF2':'#FF2D95'}}>%{son.tutar}</div>
            </div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-6 gap-y-4 mb-6">
            {[['En düşük',son.min+' FPS'],['En yüksek',son.max+' FPS'],
              ['Kare süresi',son.kare+' ms'],['Takılma',son.dusus+' kare']].map(([k,v])=>(
              <div key={k}>
                <div className="lbl text-dim mb-1.5">{k}</div>
                <div className="num text-[1.05rem]">{v}</div>
              </div>
            ))}
          </div>
          <p className="text-[.9rem] leading-relaxed text-ink/85 max-w-[62ch]">
            <span className="text-cy">%1 düşük</span> en kötü kareleri gösterir ve takılma hissini
            ortalamadan daha iyi anlatır. Ortalaman {son.ort}, %1 düşüğün {son.dusuk1} —
            arada %{Math.round((1-son.dusuk1/son.ort)*100)} fark var.
            {/* Eşik gevşekti: 160'a karşı 83 "dengeli" sayılıyordu. Sektör kabulü,
                %1 düşüğün ortalamanın ~%75'i üstünde kalmasıdır. */}
            {son.dusuk1 < son.ort*0.55
              ? ' Bu büyük bir uçurum: sayı akıcı görünse de gözüne belirgin takılma gelir.'
              : son.dusuk1 < son.ort*0.75
                ? ' Arada hissedilir takılmalar var, kritik anlarda göze çarpar.'
                : ' Akış dengeli — sayılar birbirine yakın, iyi.'}
            {' '}Tutarlılık %{son.tutar}: {son.tutar>=90?'kare süreleri çok düzenli.':son.tutar>=75?'kabul edilebilir dalgalanma var.':'kare süreleri oynak, arka planda çalışan işleri kapatıp tekrar dene.'}
          </p>
        </div>
      )}

      {gecmis.length>0 && (
        <div className="mt-8 pt-7 border-t border-line">
          <div className="lbl text-dim mb-4">SON TESTLERİN</div>
          <ul className="space-y-2.5">
            {gecmis.map((g,i)=>(
              <li key={g.ts+'-'+i} className="flex flex-wrap justify-between gap-x-6 gap-y-1 text-[.85rem] pb-2.5 border-b border-line/60">
                <span className="text-dim">{g.yog} · {g.sure} sn · {zamanFarki(g.ts)}</span>
                <span className="num">
                  <span className="text-cy">{g.ort}</span> ort · {g.dusuk1} düşük · %{g.tutar} tutarlı
                </span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════ AKICILIK KARŞILAŞTIRMASI ═══════════════════
   Aynı hızda hareket eden ama farklı sıklıkta güncellenen şeritler.
   FPS'in ne demek olduğunu anlatmanın en hızlı yolu: göstermek. */
function AkicilikTesti(){
  const [hz,setHz]=useState(null);
  const refs=[useRef(null),useRef(null),useRef(null),useRef(null)];
  const HEDEF=[15,30,60,null];   /* null = ekranın kendi hızı */
  useEffect(()=>{ measureHz().then(setHz); },[]);
  useEffect(()=>{
    let raf; const t0=performance.now(); const sonG=[0,0,0,0];
    const konum=[0,0,0,0];
    const tik=t=>{
      const gecen=(t-t0)/1000;
      for(let i=0;i<4;i++){
        const hedef=HEDEF[i];
        const araly=hedef? 1000/hedef : 0;
        if(!hedef || t-sonG[i]>=araly){
          sonG[i]=t;
          const el=refs[i].current;
          if(el){
            const w=el.parentElement.clientWidth-56;
            const p=(gecen*260)%(w*2);
            konum[i]=p<w?p:w*2-p;
            el.style.transform=`translateX(${konum[i]}px)`;
          }
        }
      }
      raf=requestAnimationFrame(tik);
    };
    raf=requestAnimationFrame(tik);
    return()=>cancelAnimationFrame(raf);
  },[]);

  const etiket=['15 FPS','30 FPS','60 FPS',hz?hz+' Hz — ekranın':'Ekranın kendi hızı'];
  const aciklama=['Kareler arası boşluk büyük — nesne adeta ışınlanıyor. Göz takip etmekte zorlanır.',
                  'Sinema seviyesi. İzlemeye yeter, nişan almaya yetmez.',
                  'Akıcı sayılan eşik. Çoğu oyuncunun hedefi burasıdır.',
                  'Ekranın verebildiği en iyisi. 60 FPS şeridiyle kıyasla.'];
  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-8">
        Dört kutu da <span className="text-ink">tamamen aynı hızda</span> hareket ediyor — sadece
        güncellenme sıklıkları farklı. Aradaki farkı okumaya değil, görmeye çalış.
      </p>
      <div className="space-y-6">
        {HEDEF.map((h,i)=>(
          <div key={i}>
            <div className="flex justify-between items-baseline gap-4 mb-2">
              <span className="lbl text-cy">{etiket[i]}</span>
              <span className="text-[.8rem] text-dim leading-snug text-right max-w-[46ch]">{aciklama[i]}</span>
            </div>
            <div className="relative h-[56px] border border-line overflow-hidden" style={{background:'#0b0b12'}}>
              <div ref={refs[i]} className="absolute top-1/2 -translate-y-1/2 left-2"
                   style={{width:40,height:40,background:i===3?'#2DE2E6':'#ECEBF2',willChange:'transform',borderRadius:2}}/>
            </div>
          </div>
        ))}
      </div>
      <p className="mt-8 text-[.82rem] text-dim leading-relaxed max-w-[62ch]">
        Not: en alttaki şerit ekranının yenileme hızında çalışır. 60 Hz ekrandaysan alttaki iki şerit
        birbirinin aynısı görünür — fark görmek için 120 Hz üstü ekran gerekir.
      </p>
    </div>
  );
}

/* ═══════════════════ REFLEKS: TEPKİ SÜRESİ ═══════════════════ */
function TepkiTesti(){
  const [durum,setDurum]=useState('bekle');  /* bekle | hazirlan | simdi | erken | sonuc */
  const [sonuclar,setSonuclar]=useState([]);
  const zaman=useRef(0), tid=useRef(null);

  useEffect(()=>()=>clearTimeout(tid.current),[]);

  const tikla=()=>{
    if(durum==='bekle'||durum==='sonuc'||durum==='erken'){
      setDurum('hazirlan');
      tid.current=setTimeout(()=>{ zaman.current=performance.now(); setDurum('simdi'); },
                             1200+Math.random()*3000);
    } else if(durum==='hazirlan'){
      clearTimeout(tid.current); setDurum('erken');
    } else if(durum==='simdi'){
      const ms=Math.round(performance.now()-zaman.current);
      setSonuclar(s=>[...s,ms]); setDurum('sonuc');
    }
  };
  const ort=sonuclar.length?Math.round(sonuclar.reduce((a,b)=>a+b,0)/sonuclar.length):0;
  const enIyi=sonuclar.length?Math.min.apply(null,sonuclar):0;
  const renk={bekle:'#0b0b12',hazirlan:'#7a1030',simdi:'#0d7a4a',erken:'#3a0f1c',sonuc:'#12121a'}[durum];
  const yazi={bekle:'Başlamak için tıkla',hazirlan:'Bekle… yeşili gör',simdi:'ŞİMDİ! TIKLA',
              erken:'Çok erken — tekrar denemek için tıkla',sonuc:sonuclar.length?sonuclar[sonuclar.length-1]+' ms':''}[durum];
  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-6">
        Kutuya tıkla, kırmızı olsun. Yeşile döndüğü anda tekrar tıkla. Erken tıklarsan sayılmaz.
        İnsan ortalaması 200-300 ms; oyuncularda 150-200 ms.
      </p>
      <button onClick={tikla}
        className="w-full h-[280px] sm:h-[340px] border border-line grid place-items-center transition-colors duration-150"
        style={{background:renk}}>
        <span className={'font-light '+(durum==='sonuc'?'num text-[3.4rem]':'text-[1.4rem]')}
              style={{color: durum==='simdi'?'#fff':'#ECEBF2'}}>{yazi}</span>
      </button>
      {sonuclar.length>0 && (
        <div className="mt-7 pt-6 border-t border-line grid grid-cols-3 gap-6">
          {[['Deneme',sonuclar.length],['Ortalama',ort+' ms'],['En iyi',enIyi+' ms']].map(([k,v])=>(
            <div key={k}>
              <div className="lbl text-dim mb-1.5">{k}</div>
              <div className="num text-[1.4rem] text-cy">{v}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════ REFLEKS: CPS (saniyede tıklama) ═══════════════════ */
function CpsTesti(){
  const [sure,setSure]=useState(5);
  const [kalan,setKalan]=useState(5);
  const [say,setSay]=useState(0);
  const [durum,setDurum]=useState('hazir');
  const [rekor,setRekor]=useState(()=>{ try{return +localStorage.getItem('sh_cps_v1')||0;}catch(e){return 0;} });
  const tid=useRef(null);

  useEffect(()=>()=>clearInterval(tid.current),[]);

  const tikla=()=>{
    if(durum==='hazir'){
      setSay(1); setDurum('oynuyor'); setKalan(sure);
      const bit=performance.now()+sure*1000;
      tid.current=setInterval(()=>{
        const k=(bit-performance.now())/1000;
        if(k<=0){ clearInterval(tid.current); setKalan(0); setDurum('bitti'); }
        else setKalan(Math.ceil(k*10)/10);
      },50);
    } else if(durum==='oynuyor') setSay(s=>s+1);
  };
  const cps=durum==='bitti'? Math.round(say/sure*100)/100 : (durum==='oynuyor'? Math.round(say/Math.max(0.1,sure-kalan)*10)/10 : 0);
  useEffect(()=>{
    if(durum==='bitti' && cps>rekor){ setRekor(cps); try{localStorage.setItem('sh_cps_v1',String(cps));}catch(e){} }
  },[durum]);

  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-6">
        Süre başlayınca olabildiğince hızlı tıkla. Ortalama 6-8 CPS, iyi oyuncular 10+.
      </p>
      <div className="flex gap-2 mb-5">
        {[5,10].map(s=>(
          <button key={s} onClick={()=>{setSure(s);setKalan(s);setSay(0);setDurum('hazir');}} disabled={durum==='oynuyor'} aria-pressed={sure===s}
            className={'lbl px-4 py-2.5 border transition-colors disabled:opacity-40 '+(sure===s?'border-cy text-cy bg-cy/[.07]':'border-line text-dim hover:text-ink')}>
            {s} SN
          </button>
        ))}
        <button onClick={()=>{clearInterval(tid.current);setSay(0);setKalan(sure);setDurum('hazir');}}
          className="lbl px-4 py-2.5 border border-line text-dim hover:text-ink transition-colors">SIFIRLA</button>
      </div>
      <button onClick={tikla}
        className="w-full h-[260px] sm:h-[300px] border border-line grid place-items-center select-none"
        style={{background:durum==='oynuyor'?'#101821':'#0b0b12',cursor:durum==='bitti'?'default':'pointer'}}>
        <span className="text-center">
          <span className="num block text-[3.4rem] font-light text-cy leading-none">{say}</span>
          <span className="lbl text-dim block mt-3">
            {durum==='hazir'?'BAŞLAMAK İÇİN TIKLA':durum==='oynuyor'?kalan.toFixed(1)+' SN KALDI':'BİTTİ'}
          </span>
        </span>
      </button>
      <div className="mt-7 pt-6 border-t border-line grid grid-cols-3 gap-6">
        {[['Tıklama',say],['CPS',cps||'—'],['Rekorun',rekor||'—']].map(([k,v])=>(
          <div key={k}>
            <div className="lbl text-dim mb-1.5">{k}</div>
            <div className="num text-[1.4rem] text-cy">{v}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════ GİRDİ: KLAVYE ═══════════════════ */
const KLAVYE_DIZILIM=[
  ['Escape','F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'],
  ['Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal','Backspace'],
  ['Tab','KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight','Backslash'],
  ['CapsLock','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote','Enter'],
  ['ShiftLeft','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','ShiftRight'],
  ['ControlLeft','MetaLeft','AltLeft','Space','AltRight','ControlRight','ArrowLeft','ArrowUp','ArrowDown','ArrowRight'],
];
const TUS_ETIKET=c=>c.replace(/^Key/,'').replace(/^Digit/,'').replace(/^Arrow/,'')
  .replace('Backquote','`').replace('Minus','-').replace('Equal','=')
  .replace('BracketLeft','[').replace('BracketRight',']').replace('Backslash','\\')
  .replace('Semicolon',';').replace('Quote','\'').replace('Comma',',').replace('Period','.').replace('Slash','/')
  .replace('ControlLeft','Ctrl').replace('ControlRight','Ctrl').replace('ShiftLeft','Shift').replace('ShiftRight','Shift')
  .replace('AltLeft','Alt').replace('AltRight','Alt').replace('MetaLeft','Win').replace('CapsLock','Caps')
  .replace('Backspace','⌫').replace('Escape','Esc').replace('Space','Boşluk').replace('Enter','Enter').replace('Tab','Tab')
  .replace('Left','←').replace('Up','↑').replace('Down','↓').replace('Right','→');

function KlavyeTesti(){
  const [basili,setBasili]=useState(new Set());
  const [gorulen,setGorulen]=useState(new Set());
  const [enCok,setEnCok]=useState(0);
  const [sonTus,setSonTus]=useState(null);
  useEffect(()=>{
    const alt=e=>{
      e.preventDefault();
      setBasili(s=>{ const y=new Set(s); y.add(e.code); setEnCok(m=>Math.max(m,y.size)); return y; });
      setGorulen(s=>new Set(s).add(e.code));
      setSonTus({code:e.code,key:e.key,which:e.keyCode});
    };
    const ust=e=>{ setBasili(s=>{ const y=new Set(s); y.delete(e.code); return y; }); };
    window.addEventListener('keydown',alt); window.addEventListener('keyup',ust);
    return()=>{ window.removeEventListener('keydown',alt); window.removeEventListener('keyup',ust); };
  },[]);
  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-6">
        Tuşlara bas — basılan tuş yanar, bir kez basılmış tuş işaretli kalır. Hiç yanmayan tuş
        arızalıdır. Aynı anda kaç tuş algılandığını da sayıyoruz (oyunda aynı anda yürü + zıpla + ateş için önemli).
      </p>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-6 gap-y-4 mb-6 pb-6 border-b border-line">
        {[['Şu an basılı',basili.size],['Aynı anda en çok',enCok],['Denenen tuş',gorulen.size],
          ['Son tuş',sonTus?sonTus.code:'—']].map(([k,v])=>(
          <div key={k}>
            <div className="lbl text-dim mb-1.5">{k}</div>
            <div className="num text-[1.05rem] truncate">{v}</div>
          </div>
        ))}
      </div>
      <div className="space-y-1.5 overflow-x-auto pb-2">
        {KLAVYE_DIZILIM.map((sira,i)=>(
          <div key={i} className="flex gap-1.5 min-w-max">
            {sira.map(c=>{
              const on=basili.has(c), gor=gorulen.has(c);
              const gen = c==='Space'?190 : /Shift|CapsLock|Backspace|Enter|Tab/.test(c)?76 : 40;
              return (
                <span key={c} className="grid place-items-center text-[10px] font-mono transition-colors duration-75"
                  style={{width:gen,height:38,borderRadius:2,
                          border:'1px solid '+(on?'#2DE2E6':gor?'rgba(45,226,230,.35)':'rgba(236,235,242,.12)'),
                          background:on?'rgba(45,226,230,.28)':gor?'rgba(45,226,230,.07)':'transparent',
                          color:on?'#2DE2E6':gor?'#ECEBF2':'#8B88A0',
                          boxShadow:on?'0 0 14px rgba(45,226,230,.5)':'none'}}>
                  {TUS_ETIKET(c)}
                </span>
              );
            })}
          </div>
        ))}
      </div>
      <button onClick={()=>{setGorulen(new Set());setEnCok(0);}}
        className="mt-6 lbl px-5 py-2.5 border border-line text-dim hover:text-ink transition-colors">SIFIRLA</button>
    </div>
  );
}

/* ═══════════════════ GİRDİ: MOUSE ═══════════════════ */
function MouseTesti(){
  const [tuslar,setTuslar]=useState({});
  const [tekerlek,setTekerlek]=useState(0);
  const [ciftTik,setCiftTik]=useState(null);
  const [hizOrn,setHizOrn]=useState(0);
  const sonTik=useRef(0), hareket=useRef([]);
  const AD={0:'Sol tuş',1:'Orta (tekerlek)',2:'Sağ tuş',3:'Geri',4:'İleri'};

  const bas=e=>{
    e.preventDefault();
    setTuslar(t=>({...t,[e.button]:(t[e.button]||0)+1}));
    if(e.button===0){
      const s=performance.now();
      if(sonTik.current && s-sonTik.current<500) setCiftTik(Math.round(s-sonTik.current));
      sonTik.current=s;
    }
  };
  const kaydir=e=>{ e.preventDefault(); setTekerlek(t=>t+(e.deltaY>0?1:-1)); };
  const oynat=e=>{

/* ═══════════════════ GİRDİ: MOUSE DPI ═══════════════════ */
function DpiTesti(){
  const [suruklenen,setSuruklenen]=useState(0);
  const [suruyor,setSuruyor]=useState(false);
  const [cm,setCm]=useState('10');
  const bas=useRef(0);
  const sonuc = (suruklenen>10 && +cm>0) ? Math.round(suruklenen/((+cm)/2.54)) : 0;
  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-6">
        Farenin DPI'ı, 1 inç hareket ettiğinde imlecin kaç piksel gittiğidir. Ölçmek için:
        cetvelle masanda bir mesafe belirle, aşağıdaki alanda fareyi <span className="text-ink">tam o kadar</span>
        {' '}yatay kaydır (tuşu basılı tut), sonra mesafeyi santimetre olarak yaz.
      </p>
      <div
        onMouseDown={e=>{ setSuruyor(true); setSuruklenen(0); bas.current=e.clientX; }}
        onMouseMove={e=>{ if(suruyor) setSuruklenen(Math.abs(e.clientX-bas.current)); }}
        onMouseUp={()=>setSuruyor(false)}
        onMouseLeave={()=>setSuruyor(false)}
        className="w-full h-[200px] border grid place-items-center select-none mb-6"
        style={{background:'#0b0b12',cursor:'ew-resize',borderColor:suruyor?'#2DE2E6':'rgba(236,235,242,.10)'}}>
        <span className="text-center">
          <span className="num block text-[2.6rem] font-light text-cy leading-none">{Math.round(suruklenen)}</span>
          <span className="lbl text-dim block mt-3">{suruyor?'SÜRÜKLÜYORSUN':'PİKSEL — BASILI TUTUP YATAY KAYDIR'}</span>
        </span>
      </div>
      <div className="flex flex-wrap items-end gap-5">
        <div>
          <label htmlFor="dpicm" className="lbl text-dim block mb-2">KAÇ SANTİM KAYDIRDIN</label>
          <input id="dpicm" value={cm} onChange={e=>setCm(e.target.value.replace(/[^\d.,]/g,''))} inputMode="decimal"
            className="w-[140px] px-4 py-3 bg-transparent border border-line text-ink num focus:border-cy transition-colors"/>
        </div>
        <div>
          <div className="lbl text-dim mb-2">HESAPLANAN DPI</div>
          <div className="num text-[2rem] font-light text-cy leading-none">{sonuc||'—'}</div>
        </div>
      </div>
      <p className="mt-6 text-[.78rem] text-dim leading-relaxed max-w-[60ch]">
        Windows'ta imleç hızlandırma ("işaretçi hassasiyetini artır") açıksa sonuç şaşar — ölçmeden
        önce kapat. Sonuç farenin ayarındaki DPI'a yakın çıkmalı.
      </p>
    </div>
  );
}

/* ═══════════════════ EKRAN BİLGİSİ ═══════════════════ */
function EkranBilgi(){
  const [hz,setHz]=useState(null);
  const [vp,setVp]=useState({w:window.innerWidth,h:window.innerHeight});
  useEffect(()=>{
    measureHz().then(setHz);
    const f=()=>setVp({w:window.innerWidth,h:window.innerHeight});
    window.addEventListener('resize',f); return()=>window.removeEventListener('resize',f);
  },[]);
  const dpr=window.devicePixelRatio||1;
  const en=screen.width, boy=screen.height;
  const obeb=(a,b)=>b?obeb(b,a%b):a;
  const g=obeb(en,boy);
  const ad = en/boy>2.3 ? 'Süper geniş' : Math.abs(en/boy-16/9)<0.02 ? '16:9 standart'
           : Math.abs(en/boy-16/10)<0.02 ? '16:10' : Math.abs(en/boy-21/9)<0.05 ? '21:9 ultra geniş' : 'özel';
  const satirlar=[
    ['Çözünürlük', en+'×'+boy],
    ['En-boy oranı', (en/g)+':'+(boy/g)+'  ·  '+ad],
    ['Yenileme hızı', hz===null?'ölçülemedi':hz?hz+' Hz':'ölçülüyor…'],
    ['Piksel yoğunluğu', dpr+'×'+(dpr!==1?'  (ölçeklenmiş)':'')],
    ['Gerçek piksel', Math.round(en*dpr)+'×'+Math.round(boy*dpr)],
    ['Renk derinliği', screen.colorDepth+' bit'],
    ['Tarayıcı penceresi', vp.w+'×'+vp.h],
  ];
  return (
    <div>
      <p className="text-[.95rem] text-dim leading-relaxed max-w-[62ch] mb-7">
        Ekranının tarayıcıya bildirdiği değerler. Aldığın monitörün kutusunda yazanlarla karşılaştır —
        tutmuyorsa ya sürücü ya kablo ya da Windows ayarı yanlıştır.
      </p>
      <dl className="grid sm:grid-cols-2 gap-x-10 gap-y-6">
        {satirlar.map(([k,v])=>(
          <div key={k}>
            <dt className="lbl text-dim mb-1.5">{k}</dt>
            <dd className="num text-[1.15rem] text-ink/90">{v}</dd>
          </div>
        ))}
      </dl>
      {hz>0 && hz<80 && (
        <p className="mt-7 p-4 border text-[.88rem] leading-relaxed"
           style={{borderColor:'rgba(255,45,149,.35)',background:'rgba(255,45,149,.06)',color:'#ECEBF2'}}>
          Ekranın {hz} Hz görünüyor. Eğer 144 Hz bir monitör aldıysan Windows'ta
          <span className="text-mg"> Ayarlar → Sistem → Ekran → Gelişmiş ekran</span> yolundan
          yenileme hızını elle yükseltmen gerekiyor; kutudan çıkan kablo da yeterli olmayabilir.
        </p>
      )}
    </div>
  );
}

/* İki kelime arasındaki düzenleme mesafesi (Levenshtein) — "mause"/"mouse"
   gibi yazım hatalarını yakalamak için. Kelimeler kısa (site içi anahtar
   kelimeler), O(n*m) burada sorun değil. */
function duzenlemeMesafesi(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let onceki=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const simdi=[i];
    for(let j=1;j<=n;j++){
      simdi[j]=a[i-1]===b[j-1] ? onceki[j-1]
        : 1+Math.min(onceki[j], simdi[j-1], onceki[j-1]);
    }
    onceki=simdi;
  }
  return onceki[n];
}
/* Kısa kelimede 1, orta kelimede 2, uzun kelimede 3 harflik hataya izin
   ver — "mause"→"mouse" (mesafe 1), "klavie"→"klavye" (mesafe 2) gibi
   tipik yazım hatalarını yakalar; alakasız kelimeleri eşleştirmeyecek
   kadar da sıkı (rastgele 3-4 harflik kelimeler eşleşmez). */
function benzerKelime(a,b){
  if(a===b) return true;
  if(a.length>=3 && b.length>=3 && (a.includes(b)||b.includes(a))) return true;
  const tol = b.length<=4?1 : b.length<=7?2 : 3;
  return duzenlemeMesafesi(a,b)<=tol;
}

function oneriUret(butce, istek){
  /* Bütçe eşleşmesi TEK BAŞINA ürün göstermeye yetiyordu: "mouse pad" yazan
     biri, bütçesi RGB/mikrofon aralığına da denk geldiği için alakasız
     kategoriler görüyordu. Kural artık net: kullanıcı bir şey yazdıysa,
     anahtar kelime eşleşmesi ZORUNLU — bütçe sadece sıralamada küçük bir
     ek puan. Sadece bütçe girilip metin boşsa, bütçeye göre filtrelenir. */
  /* Boşluk/tire farkı eşleşmeyi kaçırıyordu: "mouse pad" (boşluklu) yazan
     kullanıcı, anahtar listesinde sadece "mousepad" (boşluksuz) olan bir
     ürünü bulamıyordu. Karşılaştırmayı boşluk/tire yok sayarak yapıyoruz.
     Ayrıca insanlar yazım hatası yapar ("mause") veya farklı kelime
     kullanır ("fare") — tam eşleşme yoksa kelime bazlı, hataya toleranslı
     bir ikinci tur devreye giriyor. */
  const sadelestir=s=>s.toLocaleLowerCase('tr').replace(/[\s-]+/g,'');
  const kelimelere=s=>s.toLocaleLowerCase('tr').split(/[^a-zçğıöşü0-9]+/i).filter(k=>k.length>1);
  const ham=(istek||'').trim();
  const metin=sadelestir(ham);
  const metinVar=metin.length>0;
  const kullaniciKelimeleri=kelimelere(ham);

  return ONERI_URUNLER
    .map(u=>{
      let skor=0, eslesenVar=false;
      for(const k of u.anahtar){
        if(metin.includes(sadelestir(k))){ skor+=3; eslesenVar=true; continue; }
        for(const kt of kelimelere(k)){
          if(kullaniciKelimeleri.some(uk=>benzerKelime(uk,kt))){ skor+=2; eslesenVar=true; }
        }
      }
      if(butce>0 && butce>=u.minTL && butce<=u.maxTL) skor+=1;
      return {...u, skor, eslesti:eslesenVar, butceUyumlu:butce>0&&butce>=u.minTL&&butce<=u.maxTL};
    })
    .filter(u=> metinVar ? u.eslesti : u.butceUyumlu)
    .sort((a,b)=>b.skor-a.skor)
    .slice(0,5);
}

            <div>FPS DEĞERLERİ TAHMİNDİR</div>
            {/* Analitik eklendiği için bu satır şart: site "izleme yok" diyordu,
                artık ziyaret sayılıyor. Ne sayıldığını saklamak dürüst olmaz. */}
            <div>ÇEREZ YOK · ZİYARET SAYILIR, KİŞİ TAKİP EDİLMEZ</div>
            <div className="mt-3 text-dim/50">© {new Date().getFullYear()} SETUP HANE</div>
          </div>
        </div>
      </div>
    </footer>
  );
}

/* ═══════════════════ UYGULAMA ═══════════════════ */
function App(){
  const [mode,setMode]=useState('topla');           // 'topla' | 'laptop'
  const [budget,setBudget]=useState(55000);
  const [prof,setProf]=useState(PROFILES[0]);
  const [pick,setPick]=useState({cpu:'',gpu:''});   // marka tercihi
  const [lap,setLap]=useState(null);                // seçili laptop
  const [gid,setGid]=useState('cs2');
  const [rid,setRid]=useState('1080');
  const sys=useMemo(()=>buildSystem(budget,prof,pick),[budget,prof,pick]);
  const game=GAMES.find(g=>g.id===gid), res=RES.find(r=>r.id===rid);
  const act=asActive(mode,sys,lap);

  /* Sekme yönlendirmesi. Sayfa bağlantıları '#/...' ile, bölüm çıpaları
     düz '#id' ile ayrılıyor; böylece ikisi çakışmıyor. */
  const ilk=useRef(true);
  const [{route,sub},setRota]=useState(()=>rotaCoz());
  useEffect(()=>{
    const uygula=()=>{
      const r=rotaCoz();
      setRota(r);
      /* Başlık ve açıklamayı rotaya göre güncelle — hem arama sonucu hem
         analitik sayfa adı için gerekli. /testler/xxx alt sayfaları önceden
         hepsi aynı genel "Donanım Testleri" başlığını paylaşıyordu — Google
         Search Console'da yinelenen başlık uyarısına yol açıyordu ve her
         testin kendi arama sorgusunda (ör. "mouse dpi testi") ayrı
         görünmesini engelliyordu. Şimdi TESTLER'daki isim/açıklama kullanılıyor. */
      const testSub=(r.route==='testler'&&r.sub)?TESTLER.find(x=>x.id===r.sub):null;
      const meta=testSub
        ? {t:testSub.n+' — Ücretsiz Online Araç | SETUP HANE', d:testSub.d}
        : (ROTA_META[r.route]||ROTA_META.ana);
      document.title=meta.t;
      const md=document.querySelector('meta[name="description"]');
      if(md) md.setAttribute('content',meta.d);
      const can=document.querySelector('link[rel="canonical"]');
      if(can) can.setAttribute('href','https://www.setuphane.com'+location.pathname);
      /* Ürünsüz sayfalar (ör. aksesuarlar) Google'a girmesin diye rota
         değişince robots meta'sı eklenip kaldırılıyor. Google JS ile eklenen
         robots meta'yı destekliyor (render aşamasında okunuyor). */
      let rb=document.querySelector('meta[name="robots"]');
      if(meta.noindex){
        if(!rb){ rb=document.createElement('meta'); rb.setAttribute('name','robots'); document.head.appendChild(rb); }
        rb.setAttribute('content','noindex,follow');
      } else if(rb){ rb.remove(); }
      /* Analitiğe sayfa görüntülemesi bildir. Tek sayfa uygulamasında rota
         değişimi kendiliğinden sayılmıyor; sayılmazsa hemen çıkma oranı
         yapay olarak %100 görünüyor. */
      sayfaGoruntuleme(location.pathname);
      const cp=location.hash&&location.hash.length>1?location.hash.slice(1):null;
      if(cp){ setTimeout(()=>{ const el=document.getElementById(cp); if(el) el.scrollIntoView(); },70); }
      else if(!ilk.current){ window.scrollTo(0,0); }
      ilk.current=false;
    };
    /* Site içi bağlantıları yakala: tam sayfa yenilemeden gez. */
    const tik=e=>{
      if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
      const a=e.target.closest&&e.target.closest('a[href^="/"]');
      if(!a||a.target==='_blank'||a.hasAttribute('download')) return;
      e.preventDefault();
      const yol=a.getAttribute('href');
      if(location.pathname!==yol) history.pushState({},'',yol);
      uygula();
    };
    document.addEventListener('click',tik);
    window.addEventListener('popstate',uygula);
    uygula();
    return()=>{ document.removeEventListener('click',tik); window.removeEventListener('popstate',uygula); };
  },[]);

  useEffect(()=>{
    const b=document.getElementById('boot');
    if(b){ b.classList.add('gone'); setTimeout(()=>b.remove(),800); }
  },[]);

  return (
    <div className="relative z-10">
      <Nav route={route}/>

      {route==='aksesuarlar' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <AksesuarlarHub/>
          <Footer/>
        </main>
      )}

      {route==='oner' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <OnerHub/>
          <Footer/>
        </main>
      )}

      {route==='testler' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <TestlerHub sub={sub} sys={sys}/>
          <Footer/>
        </main>
      )}

      {route==='forum' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <Forum sys={sys} prof={prof}/>
          <Footer/>
        </main>
      )}

      {route==='hakkimizda' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <HakkimizdaSayfa/>
          <Footer/>
        </main>
      )}

      {route==='isbirlikleri' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <IsBirlikleriSayfa/>
          <Footer/>
        </main>
      )}

      {route==='gizlilik' && (
        <main id="main" className="max-w-[1100px] mx-auto px-5 sm:px-8 lg:px-12 pt-[128px] lg:pt-[132px]">
          <GizlilikSayfa/>
          <Footer/>
        </main>
      )}

      {route==='ana' && (
      <main id="main" className="max-w-[1500px] mx-auto px-5 sm:px-8 lg:px-12">
        <Hero/>
        <div className="grid lg:grid-cols-[minmax(0,1fr)_330px] xl:grid-cols-[minmax(0,1fr)_390px] gap-x-14 xl:gap-x-20">
          <div className="min-w-0">
            <How/>

            <section id="builder" className="py-16 lg:py-24 scroll-mt-24">
              <Reveal>
                <Label className="mb-4">MODÜL 01 — CANLI HESAP</Label>
                <div className="rule mb-10"/>
                <h2 className="h-xl text-[clamp(2rem,6.4vw,4.4rem)] max-w-[15ch]">
                  Paranın <span className="em">tamamı</span> işe yarasın.
                </h2>
                <p className="mt-6 text-dim max-w-[52ch] leading-relaxed text-[.95rem]">
                  Önce yolu seç: parçaları kendin mi alacaksın, yoksa kutudan çıkan hazır bir laptop mu?
                  İkisinde de bütçeyi oynattıkça sonuç anında güncellenir.
                </p>
              </Reveal>
              <Reveal delay={90}>
                <div className="mt-10"><ModeSwitch mode={mode} setMode={setMode}/></div>
              </Reveal>
              <Reveal delay={140}>
                {mode==='topla'
                  ? <>
                      <Builder budget={budget} setBudget={setBudget} prof={prof} setProf={setProf}
                               sys={sys} pick={pick} setPick={setPick}/>
                      <AmdIntelCompare budget={budget} prof={prof} game={game} res={res}/>
                    </>
                  : <LaptopPicker budget={budget} setBudget={setBudget} sel={lap} setSel={setLap}
                                  game={game} res={res}/>}
              </Reveal>
            </section>

            <GameTest act={act} gid={gid} setGid={setGid} rid={rid} setRid={setRid}/>
            <BalanceTest sys={sys}/>
            <Glossary/>
            <Kesfet/>
            <Trust/>
          </div>
          <Panel sys={sys} act={act} prof={prof} game={game} res={res}/>
        </div>
        <Footer/>
      </main>
      )}

      {route==='ana' && <MobileDock sys={sys} act={act} prof={prof} game={game} res={res}/>}
      <CerezBandi/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CurProvider><LangProvider><App/></LangProvider></CurProvider>);
</script>
</body>
</html>
